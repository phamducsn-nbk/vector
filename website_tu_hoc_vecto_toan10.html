<style>

button.ai{background:linear-gradient(90deg,#7c3aed,#2563eb)}button.ai:disabled{background:#94a3b8}

.drop.small{padding:16px;margin-top:8px}.srcitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin-top:8px;font-size:14px}.srcitem .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<body>
<div id="login" class="login">
 <div class="login-card">
  <div class="logo">🧭</div><h1>KHÁM PHÁ VECTƠ</h1><p>Chương IV · Toán học lớp 10</p>
  <label for="studentName">Họ và tên</label><input id="studentName" placeholder="Nhập họ và tên của em">
  <label for="studentClass">Lớp</label><input id="studentClass" placeholder="Ví dụ: 10A1" onkeydown="if(event.key==='Enter')loginStudent()">
  <button class="green" style="width:100%;margin-top:18px" onclick="loginStudent()">Bắt đầu học</button>
  <p style="font-size:12px">Thông tin được lưu trên trình duyệt trong bản thử nghiệm.</p>
 </div>
</div>
<div id="app" class="app">
 <aside class="sidebar">
  <div class="brand">🧭 VECTƠ 10<span>Hệ thống tự học Toán</span></div>
  <nav id="nav"></nav>
  <button class="mode" id="modeBtn" onclick="toggleTeacher()">⚙ Chế độ giáo viên</button>

 </aside>
 <main class="main">
  <div class="top"><h2 id="pageTitle">Trang học tập</h2><div class="userchip" id="userchip"></div></div>
  <div id="view"></div>
 </main>
</div>
<div id="toast" class="toast"></div>
<input type="file" id="fileIn" multiple class="hidden" onchange="addFiles(this.files);this.value=''">
<input type="file" id="aiIn" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.docx,.pptx,.txt,.md" class="hidden" onchange="aiAddFiles(this.files);this.value=''">
<input type="file" id="restoreIn" accept=".json,application/json" class="hidden" onchange="importData(this.files[0]);this.value=''">
<!-- Dữ liệu nhúng: được điền tự động khi giáo viên "Tải về trang web cho học sinh". Không sửa tay. -->
<script id="vec-data" type="application/json">null</script>
<script>
const ORIGINAL_HTML="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
const lessons=[
 {id:7,title:"Các khái niệm mở đầu",pages:"46–50",icon:"➡️"},
 {id:8,title:"Tổng và hiệu của hai vectơ",pages:"51–54",icon:"➕"},
 {id:9,title:"Tích của một vectơ với một số",pages:"55–59",icon:"✖️"},
 {id:10,title:"Vectơ trong mặt phẳng tọa độ",pages:"60–65",icon:"📍"},
 {id:11,title:"Tích vô hướng của hai vectơ",pages:"66–70",icon:"📐"},
 {id:12,title:"Ôn tập cuối chương IV",pages:"71–72",icon:"📝"}
];
const defaultQuestions=[
 {lesson:7,type:"mc",question:"Hai vectơ được gọi là bằng nhau khi nào?",options:["Có cùng độ dài","Cùng hướng và cùng độ dài","Cùng phương","Có chung điểm đầu"],answer:1,hints:["Em hãy xét cả độ dài và hướng của vectơ.","Hai điều kiện cần đồng thời: cùng hướng và cùng độ dài."],explanation:"Hai vectơ bằng nhau khi chúng cùng hướng và có cùng độ dài."},
 {lesson:7,type:"tf",question:"Hai vectơ cùng phương thì luôn cùng hướng.",options:["Đúng","Sai"],answer:1,hints:["Cùng phương có thể cùng chiều hoặc ngược chiều.","Hãy phân biệt cùng phương với cùng hướng."],explanation:"Phát biểu sai. Hai vectơ cùng phương có thể cùng hướng hoặc ngược hướng."},
 {lesson:8,type:"short",question:"Theo quy tắc ba điểm, vectơ AB + vectơ BC bằng vectơ nào? (Nhập AC)",answerText:"AC",hints:["Điểm cuối của vectơ thứ nhất là điểm đầu của vectơ thứ hai.","Đường đi A đến B rồi B đến C tương đương đi trực tiếp A đến C."],explanation:"Theo quy tắc ba điểm: vectơ AB + vectơ BC = vectơ AC."},
 {lesson:9,type:"mc",question:"Nếu k > 0 thì vectơ k·a có hướng như thế nào so với vectơ a (a khác vectơ 0)?",options:["Ngược hướng","Cùng hướng","Vuông góc","Không xác định"],answer:1,hints:["Xét dấu của hệ số k.","Hệ số dương giữ nguyên hướng của vectơ."],explanation:"Với k > 0, vectơ k·a cùng hướng với vectơ a."},
 {lesson:10,type:"short",question:"Vectơ a có tọa độ (3; 4). Độ dài của vectơ a bằng bao nhiêu?",answerText:"5",hints:["Dùng công thức độ dài vectơ trong mặt phẳng tọa độ.","Tính căn bậc hai của tổng bình phương hai tọa độ."],explanation:"|a| = √(3² + 4²) = 5."},
 {lesson:11,type:"mc",question:"Hai vectơ khác vectơ 0 vuông góc thì tích vô hướng bằng:",options:["1","-1","0","Tích độ dài"],answer:2,hints:["Nhớ công thức tích vô hướng theo góc giữa hai vectơ.","Cos 90° bằng 0."],explanation:"Hai vectơ vuông góc có tích vô hướng bằng 0."}
];
const L="ABCDEF",MB=1024*1024;
const typeName={mc:"Trắc nghiệm",tf:"Đúng/Sai",short:"Trả lời ngắn"};

/* ===== Lưu trữ: câu hỏi trong localStorage, tài liệu (tệp lớn) trong IndexedDB ===== */
let dbp=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{let r=indexedDB.open("vec10",1);r.onupgradeneeded=()=>r.result.createObjectStore("materials",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}
async function idb(mode,fn){let d=await db();return new Promise((res,rej)=>{let tx=d.transaction("materials",mode),st=tx.objectStore("materials"),r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
const idbAll=()=>idb("readonly",s=>s.getAll()),idbPut=m=>idb("readwrite",s=>s.put(m)),idbDel=id=>idb("readwrite",s=>s.delete(id)),idbClear=()=>idb("readwrite",s=>s.clear());
async function idbReplaceAll(list){await idbClear();for(const m of list)await idbPut(m)}

const EMB=(()=>{try{return JSON.parse(document.getElementById("vec-data").textContent)}catch(e){return null}})();
const STUDENT_ONLY=!!(EMB&&EMB.studentOnly)&&location.hash!=="#giaovien";
let questions=[],materials=[];
function cleanMats(list){return (list||[]).map(m=>({...m,id:String(m.id||newId()).replace(/[^\w-]/g,"")}))}
const ready=(async()=>{
 let localAt=Number(localStorage.getItem("vec_savedAt")||0);
 if(EMB&&EMB.savedAt>localAt){
  questions=EMB.questions||[];materials=cleanMats(EMB.materials);
  localStorage.setItem("vec_questions",JSON.stringify(questions));localStorage.setItem("vec_savedAt",String(EMB.savedAt));
  try{await idbReplaceAll(materials)}catch(e){console.warn(e)}
 }else{
  questions=JSON.parse(localStorage.getItem("vec_questions")||"null")||defaultQuestions.map(q=>({...q}));
  try{materials=cleanMats(await idbAll())}catch(e){materials=[]}
 }
})();
function touch(){localStorage.setItem("vec_savedAt",String(Date.now()))}
function saveQ(){localStorage.setItem("vec_questions",JSON.stringify(questions));touch()}

let student=null,teacher=false,currentLesson=7,section="home",attempts={},scores=JSON.parse(localStorage.getItem("vec_scores")||"[]");
let stLesson=7,stTab="materials",editIdx=null,draft=null,bulkText="";

/* ===== Tiện ích chung ===== */
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function hero(h,p,cls){return `<div class="hero ${cls||""}"><div class="hero-author">Tác giả: Phạm Thu Hường</div><div class="hero-title">HỖ TRỢ TỰ HỌC CHỦ ĐỀ VECTƠ</div><h1>${h}</h1><p>${p}</p></div>`}
function setActive(key){document.querySelectorAll('#nav .navbtn').forEach(b=>b.classList.toggle('active',b.dataset.key===String(key)))}
let toastTimer;function toast(msg,type){let t=document.getElementById("toast");t.textContent=msg;t.className="toast show "+(type||"");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className="toast",3200)}
function newId(){return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function lessonById(id){return lessons.find(x=>x.id===id)}
function lessonLabel(id){return id===12?"Ôn tập":"Bài "+id}
function matsOf(id){return materials.filter(m=>m.lesson===id).sort((a,b)=>a.order-b.order)}
function qCount(id){return questions.filter(q=>q.lesson===id).length}
function fmtSize(b){b=b||0;return b>=MB?(b/MB).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB"}
function download(blob,name){let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function norm(s){return String(s??"").normalize("NFC").toLowerCase().replace(/vectơ|vecto|vector/g,"").replace(/[\s→⃗]/g,"").replace(/,/g,".")}
function matchShort(q,v){let n=norm(v);return !!n&&String(q.answerText||"").split("|").some(a=>norm(a)===n)}
function safeUrl(u){u=String(u||"").trim();if(!/^https?:\/\//i.test(u))u="https://"+u.replace(/^\/+/,"");return u}
function ytId(u){let m=String(u||"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);return m&&m[1]}
function driveId(u){let m=String(u||"").match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]{10,})/);return m&&m[1]}
const EXT_MIME={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",svg:"image/svg+xml",mp4:"video/mp4",webm:"video/webm",mov:"video/quicktime",mp3:"audio/mpeg",wav:"audio/wav",m4a:"audio/mp4"};
function ext(name){return (String(name).split(".").pop()||"").toLowerCase()}
function fkind(m){let t=m.mime||"",e=ext(m.name);
 if(t.startsWith("image/")||/^(png|jpe?g|gif|webp|svg|bmp)$/.test(e))return"image";
 if(t==="application/pdf"||e==="pdf")return"pdf";
 if(t.startsWith("video/")||/^(mp4|webm|ogv|mov|m4v)$/.test(e))return"video";
 if(t.startsWith("audio/")||/^(mp3|wav|ogg|m4a|aac)$/.test(e))return"audio";
 if(/^(docx?|odt|rtf)$/.test(e))return"word";if(/^(pptx?|odp)$/.test(e))return"ppt";if(/^(xlsx?|ods|csv)$/.test(e))return"excel";return"other"}
const ICON={image:"🖼️",pdf:"📕",video:"🎬",audio:"🎧",word:"📘",ppt:"📙",excel:"📗",other:"📎",link:"🔗",yt:"▶️",drive:"📁",note:"📝"};
const KNAME={image:"Ảnh",pdf:"PDF",video:"Video",audio:"Âm thanh",word:"Word",ppt:"PowerPoint",excel:"Bảng tính",other:"Tệp"};
function micon(m){if(m.kind==="note")return ICON.note;if(m.kind==="link")return ytId(m.url)?ICON.yt:driveId(m.url)?ICON.drive:ICON.link;return ICON[fkind(m)]}
function mdesc(m){if(m.kind==="note")return"Ghi chú · "+(m.text||"").length+" ký tự";if(m.kind==="link")return ytId(m.url)?"Video YouTube":driveId(m.url)?"Google Drive":m.url;return KNAME[fkind(m)]+" · "+fmtSize(m.size)}
const urlCache={};
function blobUrl(m){if(urlCache[m.id])return urlCache[m.id];let [h,b]=String(m.data||",").split(","),bin=atob(b||""),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return urlCache[m.id]=URL.createObjectURL(new Blob([arr],{type:m.mime||EXT_MIME[ext(m.name)]||"application/octet-stream"}))}

function loginStudent(){let n=document.getElementById("studentName").value.trim(),c=document.getElementById("studentClass").value.trim();if(!n||!c){alert("Vui lòng nhập họ tên và lớp.");return}student={name:n,class:c};document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";document.getElementById("userchip").textContent=n+" · "+c;buildNav();home()}
function logout(){student=null;teacher=false;updateModeBtn();document.getElementById("app").style.display="none";document.getElementById("login").style.display="grid"}
function buildNav(){let n=document.getElementById("nav");n.innerHTML=`<button class="navbtn" data-key="home" onclick="home()">🏠 Trang chủ</button>`+lessons.map(l=>`<button class="navbtn" data-key="${l.id}" onclick="navLesson(${l.id})">${l.icon} Bài ${l.id===12?"Ôn tập":l.id} · ${l.title}</button>`).join("")+`<button class="navbtn" data-key="report" onclick="report()">📊 Kết quả của em</button>`}
function navLesson(id){if(teacher){if(id!==stLesson&&aiResults.length&&!confirm(`Còn ${aiResults.length} câu do AI tạo chưa lưu. Chuyển bài sẽ bỏ các câu này. Tiếp tục?`))return;if(id!==stLesson){aiResults=[];aiUseMats={};aiStatusHTML=""}stLesson=id;editIdx=null;draft=null;studio()}else openLesson(id)}
function home(){if(teacher)return studio();section="home";setActive("home");document.getElementById("pageTitle").textContent="Trang học tập";let done=JSON.parse(localStorage.getItem("vec_done_"+student.name)||"[]");document.getElementById("view").innerHTML=`${hero(`Xin chào, ${esc(student.name)}! 👋`,"Hãy chọn bài học và khám phá thế giới vectơ.")}<div class="grid"><div class="card"><div class="muted">Bài học trong chương</div><div class="stat">6</div></div><div class="card"><div class="muted">Bài đã hoàn thành</div><div class="stat">${done.length}/6</div></div><div class="card"><div class="muted">Lớp học</div><div class="stat">${esc(student.class)}</div></div></div><div class="section"><h3>📚 Các bài học</h3><div class="grid">${lessons.map(l=>`<div class="card lesson" onclick="openLesson(${l.id})"><div class="num">BÀI ${l.id===12?"ÔN TẬP":l.id}</div><h3>${l.icon} ${l.title}</h3><div class="muted">SGK trang ${l.pages}</div><div style="margin-top:14px"><span class="pill">Học · Luyện tập · Kiểm tra</span></div></div>`).join("")}</div></div>`}
function openLesson(id){currentLesson=id;section="lesson";setActive(id);let l=lessonById(id);document.getElementById("pageTitle").textContent="Bài "+(id===12?"ôn tập":id)+": "+l.title;document.getElementById("view").innerHTML=`${hero(`${l.icon} Bài ${id===12?"Ôn tập cuối chương IV":id+". "+l.title}`,`SGK trang ${l.pages} · Tự học theo tiến trình`)}<div class="tabs"><button onclick="lessonTab('materials',this)">📖 Tài liệu</button><button onclick="lessonTab('practice',this)">✍️ Luyện tập</button><button onclick="lessonTab('test',this)">📝 Kiểm tra</button></div><div id="lessonBody"></div>`;lessonTab("materials")}
function lessonTab(which,btn){section=which;document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));if(!btn)btn=document.querySelector(`.tabs button[onclick*="${which}"]`);if(btn)btn.classList.add("active");let b=document.getElementById("lessonBody");if(!b)return;if(which==="materials"){b.innerHTML=`<div class="contentbox muted">Đang tải tài liệu…</div>`;ready.then(()=>{let el=document.getElementById("lessonBody");if(el&&section==="materials")el.innerHTML=materialsHTML(currentLesson)})}else if(which==="practice"){renderPractice()}else if(which==="test"){renderTest()}}
function materialsHTML(id){let mats=matsOf(id),l=lessonById(id);return `<div class="contentbox"><h3>📖 Tài liệu học tập</h3>${mats.length?mats.map(materialView).join(""):`<p class="muted">Giáo viên chưa thêm tài liệu cho bài này.</p>`}<div class="grid" style="margin-top:14px"><div class="card"><h4 style="margin-top:0">🧠 Nội dung cần học</h4><p style="margin-bottom:0">Đọc nội dung SGK trang ${l.pages}, ghi lại kiến thức trọng tâm và xem tài liệu giáo viên cung cấp.</p></div><div class="card"><h4 style="margin-top:0">🎯 Mục tiêu tự học</h4><p style="margin-bottom:0">Hiểu kiến thức trọng tâm, hoàn thành luyện tập và tự kiểm tra mức độ nắm bài.</p></div></div></div>`}
function materialView(m){
 let head=extra=>`<div class="mview-h"><span style="font-size:22px">${micon(m)}</span><b>${esc(m.name)}</b><span class="spacer"></span>${extra||""}</div>`;
 if(m.kind==="note")return `<div class="mview">${head()}<div class="note">${esc(m.text)}</div></div>`;
 if(m.kind==="link"){let u=safeUrl(m.url),y=ytId(u),d=driveId(u),open=`<a class="btnlink" href="${esc(u)}" target="_blank" rel="noopener">Mở trong tab mới ↗</a>`;
  if(y)return `<div class="mview">${head(open)}<iframe class="ytview" src="https://www.youtube-nocookie.com/embed/${y}" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe><div class="muted" style="margin-top:6px">Nếu video không phát được, em bấm “Mở trong tab mới”.</div></div>`;
  if(d)return `<div class="mview">${head(open)}<iframe class="ytview" src="https://drive.google.com/file/d/${d}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe></div>`;
  return `<div class="mview">${head(open)}<div class="muted" style="word-break:break-all">${esc(u)}</div></div>`}
 let u,k=fkind(m);try{u=blobUrl(m)}catch(e){return `<div class="mview">${head()}<div class="muted">Không mở được tệp này.</div></div>`}
 let dl=`<a class="btnlink" href="${u}" download="${esc(m.name)}">⬇ Tải về</a>`;
 if(k==="image")return `<div class="mview">${head(dl)}<img src="${u}" alt="${esc(m.name)}"></div>`;
 if(k==="pdf")return `<div class="mview">${head(`<a class="btnlink" href="${u}" target="_blank">Mở toàn màn hình ↗</a> ${dl}`)}<iframe class="pdfview" src="${u}"></iframe></div>`;
 if(k==="video")return `<div class="mview">${head(dl)}<video src="${u}" controls preload="metadata"></video></div>`;
 if(k==="audio")return `<div class="mview">${head(dl)}<audio src="${u}" controls style="width:100%"></audio></div>`;
 return `<div class="mview">${head(dl)}<div class="muted">${esc(mdesc(m))} — em tải về để mở bằng phần mềm phù hợp.</div></div>`}
function getLessonQs(id){return questions.filter(q=>q.lesson===id||id===12)}
function renderPractice(){let b=document.getElementById("lessonBody");let qs=getLessonQs(currentLesson);if(!qs.length){b.innerHTML=`<div class="contentbox">Chưa có câu hỏi luyện tập cho bài này.</div>`;return}renderQuestion(qs,0)}
function renderQuestion(qs,i){let q=qs[i];let b=document.getElementById("lessonBody");b.innerHTML=`<div class="contentbox"><div class="pill">Câu ${i+1}/${qs.length} · ${typeName[q.type]}</div><h3>${esc(q.question)}</h3>${q.type==="short"?`<input id="answer" placeholder="Nhập câu trả lời" onkeydown="if(event.key==='Enter')checkAnswer(${i})">`:q.options.map((o,j)=>`<label class="option"><input type="radio" name="ans" value="${j}" style="width:auto;margin-right:9px"> ${esc(o)}</label>`).join("")}<div class="actions" style="margin-top:12px"><button onclick="checkAnswer(${i})">Kiểm tra câu trả lời</button><button class="secondary" onclick="renderQuestion(getLessonQs(currentLesson),${i+1})" ${i>=qs.length-1?"disabled":""}>Câu tiếp theo →</button></div><div id="feedback"></div></div>`}
function checkAnswer(i){let qs=getLessonQs(currentLesson),q=qs[i],key=currentLesson+"_"+i,tries=attempts[key]||0,correct=false;if(q.type==="short"){correct=matchShort(q,document.getElementById("answer").value)}else{let selected=document.querySelector('input[name="ans"]:checked');correct=!!selected&&Number(selected.value)===q.answer}let f=document.getElementById("feedback");if(correct){f.innerHTML=`<div class="feedback good"><b>🎉 Chính xác!</b><br>${esc(q.explanation||"Em đã trả lời đúng.")}</div>`;attempts[key]=0;recordResponse(currentLesson,q,true,tries+1)}else{tries++;attempts[key]=tries;let hint=tries<=2?(q.hints?.[tries-1]||"Em hãy xem lại nội dung kiến thức liên quan."):(q.explanation||"Hãy xem lại phần lý thuyết và thử lại.");f.innerHTML=`<div class="feedback help"><b>Chưa chính xác – hãy thử lại!</b><br>${esc(hint)}${tries>=3&&q.explanation?`<div style="margin-top:8px"><b>Giải thích:</b> ${esc(q.explanation)}</div>`:""}</div>`;recordResponse(currentLesson,q,false,tries)}}
function recordResponse(id,q,correct,attempt){scores.push({name:student.name,class:student.class,lesson:id,question:q.question,correct,attempt,date:new Date().toLocaleString()});localStorage.setItem("vec_scores",JSON.stringify(scores))}
function renderTest(){let qs=getLessonQs(currentLesson);if(!qs.length){document.getElementById("lessonBody").innerHTML=`<div class="contentbox">Chưa có câu hỏi kiểm tra cho bài này.</div>`;return}document.getElementById("lessonBody").innerHTML=`<div class="contentbox"><h3>📝 Bài kiểm tra</h3><p>Kiểm tra sử dụng câu hỏi đã có trong ngân hàng. Gợi ý không hiển thị trong chế độ kiểm tra.</p><button onclick="startTest()">Bắt đầu kiểm tra (${qs.length} câu)</button></div>`}
function startTest(){let qs=getLessonQs(currentLesson);let html=`<div class="contentbox"><h3>📝 Bài kiểm tra</h3><form id="testForm" onsubmit="return false">`;qs.forEach((q,i)=>{html+=`<div class="section"><b>Câu ${i+1}. ${esc(q.question)}</b>${q.type==="short"?`<input name="q${i}" placeholder="Câu trả lời">`:q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" style="width:auto;margin-right:8px"> ${esc(o)}</label>`).join("")}</div>`});html+=`</form><button onclick="submitTest()">Nộp bài</button><div id="testResult"></div></div>`;document.getElementById("lessonBody").innerHTML=html}
function submitTest(){let qs=getLessonQs(currentLesson),correct=0;qs.forEach((q,i)=>{if(q.type==="short"){correct+=matchShort(q,document.querySelector(`[name="q${i}"]`)?.value)?1:0}else{let selected=document.querySelector(`[name="q${i}"]:checked`);correct+=selected&&Number(selected.value)===q.answer?1:0}});let pct=Math.round(correct/qs.length*100);document.getElementById("testResult").innerHTML=`<div class="feedback good"><h3>Kết quả: ${correct}/${qs.length} câu (${pct}%)</h3><p>Hãy xem lại những câu chưa đúng ở phần luyện tập.</p></div>`;let done=JSON.parse(localStorage.getItem("vec_done_"+student.name)||"[]");if(!done.includes(currentLesson)){done.push(currentLesson);localStorage.setItem("vec_done_"+student.name,JSON.stringify(done))}scores.push({name:student.name,class:student.class,lesson:currentLesson,test:true,correct,total:qs.length,pct,date:new Date().toLocaleString()});localStorage.setItem("vec_scores",JSON.stringify(scores))}
function report(){section="report";setActive("report");document.getElementById("pageTitle").textContent="Kết quả học tập";let mine=scores.filter(s=>s.name===student.name);document.getElementById("view").innerHTML=`${hero("📊 Kết quả học tập","Thông tin ghi nhận trên trình duyệt hiện tại")}<div class="contentbox"><h3>Lịch sử hoạt động</h3>${mine.length?`<table class="table"><thead><tr><th>Thời điểm</th><th>Bài</th><th>Hoạt động</th><th>Kết quả</th></tr></thead><tbody>${mine.map(s=>`<tr><td>${esc(s.date||"")}</td><td>${lessonLabel(s.lesson)}</td><td>${s.test?"Kiểm tra":"Luyện tập"}</td><td>${s.test?`${s.correct}/${s.total} (${s.pct}%)`:s.correct?"Đúng":"Sai"}</td></tr>`).join("")}</tbody></table>`:"Chưa có dữ liệu hoạt động."}</div>`}

function stMaterials(){let mats=matsOf(stLesson);
 document.getElementById("studioBody").innerHTML=`<div class="contentbox">
  <div class="drop" id="drop" onclick="document.getElementById('fileIn').click()"><div style="font-size:36px">📤</div><b>Kéo thả tệp vào đây hoặc bấm để chọn tệp</b><div class="muted">PDF, ảnh, video, âm thanh, Word, PowerPoint… Chọn được nhiều tệp cùng lúc.</div></div>
  <div class="quick"><button class="secondary" onclick="showAdd('link')">🔗 Thêm link (YouTube, Google Drive, trang web)</button><button class="secondary" onclick="showAdd('note')">📝 Viết ghi chú / tóm tắt kiến thức</button></div>

 let d=document.getElementById("drop");
 ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("drag")}));
 ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("drag")}));
 d.addEventListener("drop",e=>addFiles(e.dataTransfer.files))}
function readDataURL(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)})}
function nextOrder(){return materials.reduce((a,m)=>Math.max(a,m.order||0),0)+1}
async function addFiles(fileList){let files=[...(fileList||[])];if(!files.length)return;
 let big=files.filter(f=>f.size>15*MB);
 if(big.length&&!confirm(`Có ${big.length} tệp lớn hơn 15 MB:\n${big.map(f=>"• "+f.name+" ("+fmtSize(f.size)+")").join("\n")}\n\nTệp lớn sẽ làm trang gửi học sinh rất nặng. Với video, nên tải lên YouTube hoặc Google Drive rồi dùng nút “Thêm link”.\n\nVẫn thêm các tệp này?`))return;
 toast(`Đang tải ${files.length} tệp…`);let ord=nextOrder(),ok=0;
 for(const f of files){try{let data=await readDataURL(f),m={id:newId(),lesson:stLesson,kind:"file",name:f.name,mime:f.type||EXT_MIME[ext(f.name)]||"",size:f.size,data,order:ord++,added:Date.now()};await idbPut(m);materials.push(m);ok++}catch(e){console.error(e);toast("Không lưu được “"+f.name+"” – bộ nhớ trình duyệt có thể đã đầy.","err")}}
 if(ok){touch();toast(`✅ Đã thêm ${ok} tệp vào ${lessonLabel(stLesson)}`)}studio()}
function showAdd(kind,id){let m=id?materials.find(x=>x.id===id):null,box=document.getElementById("addBox"),cancel=`<button class="secondary" onclick="document.getElementById('addBox').innerHTML=''">Hủy</button>`,save=`<button class="green" onclick="saveAdd('${kind}','${id||""}')">💾 Lưu</button>`;
 if(kind==="link")box.innerHTML=`<div class="addbox"><h4>🔗 ${m?"Sửa":"Thêm"} đường link</h4><div class="muted">Video YouTube và tệp Google Drive sẽ hiện trực tiếp trên trang; các link khác hiện thành nút bấm.</div><label>Đường link</label><input id="aUrl" placeholder="Dán link vào đây, ví dụ https://youtu.be/…" value="${esc(m?.url||"")}"><label>Tiêu đề hiển thị <span class="muted">(không bắt buộc)</span></label><input id="aName" placeholder="Ví dụ: Video bài giảng quy tắc ba điểm" value="${esc(m?.name||"")}"><div class="actions" style="margin-top:12px">${save}${cancel}</div></div>`;
 else if(kind==="note")box.innerHTML=`<div class="addbox"><h4>📝 ${m?"Sửa":"Viết"} ghi chú</h4><label>Tiêu đề</label><input id="aName" placeholder="Ví dụ: Tóm tắt kiến thức trọng tâm" value="${esc(m?.name||"")}"><label>Nội dung</label><textarea id="aText" style="min-height:170px" placeholder="Gõ hoặc dán nội dung. Xuống dòng sẽ được giữ nguyên.&#10;Ví dụ: Quy tắc ba điểm: AB + BC = AC">${esc(m?.text||"")}</textarea><div class="actions" style="margin-top:12px">${save}${cancel}</div></div>`;
 else box.innerHTML=`<div class="addbox"><h4>✏ Đổi tên tệp</h4><label>Tên hiển thị cho học sinh</label><input id="aName" value="${esc(m?.name||"")}"><div class="actions" style="margin-top:12px">${save}${cancel}</div></div>`;
 box.scrollIntoView({behavior:"smooth",block:"nearest"});let first=box.querySelector("input,textarea");if(first)first.focus()}
async function saveAdd(kind,id){let m=id?materials.find(x=>x.id===id):null,v=x=>(document.getElementById(x)?.value||"").trim();
 if(kind==="link"){let url=v("aUrl");if(!url)return toast("Hãy dán đường link","err");url=safeUrl(url);let name=v("aName")||(ytId(url)?"Video YouTube":driveId(url)?"Tài liệu Google Drive":url);m=m?Object.assign(m,{url,name}):{id:newId(),lesson:stLesson,kind,url,name,order:nextOrder(),added:Date.now()}}
 else if(kind==="note"){let text=document.getElementById("aText").value;if(!text.trim())return toast("Hãy nhập nội dung ghi chú","err");let name=v("aName")||"Ghi chú";m=m?Object.assign(m,{name,text}):{id:newId(),lesson:stLesson,kind,name,text,order:nextOrder(),added:Date.now()}}
 else{if(!m)return;let name=v("aName");if(!name)return toast("Tên không được để trống","err");m.name=name}
 if(!materials.includes(m))materials.push(m);
 try{await idbPut(m);touch();toast("✅ Đã lưu tài liệu")}catch(e){toast("Không lưu được – bộ nhớ trình duyệt có thể đã đầy.","err")}studio()}
async function delMat(id){let m=materials.find(x=>x.id===id);if(!m||!confirm(`Xóa tài liệu “${m.name}”?`))return;materials=materials.filter(x=>x!==m);try{await idbDel(id)}catch(e){}touch();toast("Đã xóa tài liệu");studio()}
async function moveMat(id,dir){let list=matsOf(stLesson),i=list.findIndex(m=>m.id===id),j=i+dir;if(j<0||j>=list.length)return;let a=list[i],b=list[j],t=a.order;a.order=b.order;b.order=t;if(a.order===b.order)a.order+=dir;try{await idbPut(a);await idbPut(b)}catch(e){}touch();studio()}

/* --- Câu hỏi --- */
function blankDraft(){return{type:"mc",question:"",options:["","","",""],answer:0,answerText:"",hints:["",""],explanation:""}}
function stQuestions(){if(!draft)draft=blankDraft();
 document.getElementById("studioBody").innerHTML=`<div class="seg" style="max-width:560px;margin-bottom:14px">${[["manual","✍ Tự soạn từng câu"],["ai","✨ Tạo bằng AI"+(aiResults.length?` (${aiResults.length} chưa lưu)`:"")]].map(([k,t])=>`<button class="${qMode===k?"active":""}" onclick="qMode='${k}';stQuestions()">${t}</button>`).join("")}</div><div class="qgrid ${qMode==="ai"?"wide":""}"><div class="contentbox ${qMode==="ai"?"":"sticky"}" id="qForm"></div><div class="contentbox" id="qList"></div></div>`;if(qMode==="ai")renderAI();else renderQForm();renderQList()}
function renderQForm(){let d=draft,isEdit=editIdx!=null,el=document.getElementById("qForm");if(!el)return;let ans="";
 if(d.type==="mc")ans=`<label>Các phương án <span class="muted" style="font-weight:500">— bấm vào vòng tròn để chọn đáp án đúng</span></label>${d.options.map((o,i)=>`<div class="optrow ${d.answer===i?"correct":""}"><label class="radio" title="Chọn làm đáp án đúng"><input type="radio" name="dAns" ${d.answer===i?"checked":""} onchange="draft.answer=${i};renderQForm()"><b>${L[i]}</b></label><input value="${esc(o)}" placeholder="Nhập phương án ${L[i]}" oninput="draft.options[${i}]=this.value">${d.answer===i?`<span class="tag">✔ Đúng</span>`:""}${d.options.length>2?`<button class="iconbtn" title="Xóa phương án" onclick="rmOpt(${i})">✕</button>`:""}</div>`).join("")}${d.options.length<6?`<button class="secondary small" style="margin-top:4px" onclick="addOpt()">+ Thêm phương án</button>`:""}`;
 else if(d.type==="tf")ans=`<label>Phát biểu trên là</label><div class="seg tf"><button class="${d.answer===0?"active t":""}" onclick="draft.answer=0;renderQForm()">✔ Đúng</button><button class="${d.answer===1?"active f":""}" onclick="draft.answer=1;renderQForm()">✘ Sai</button></div>`;
 else ans=`<label>Đáp án đúng</label><input value="${esc(d.answerText)}" placeholder="Ví dụ: AC" oninput="draft.answerText=this.value"><div class="muted" style="margin-top:6px">Nhiều cách viết đều đúng? Ngăn cách bằng dấu <b>|</b>, ví dụ <span class="mono">AC | CA ngược</span>. Hệ thống tự bỏ qua chữ hoa/thường, dấu cách, chữ “vectơ”, và coi 2,5 = 2.5.</div>`;
 let extra=d.hints[0]||d.hints[1]||d.explanation;
 el.innerHTML=`<h3>${isEdit?"✏ Sửa câu hỏi":"➕ Tạo câu hỏi mới"} <span class="muted" style="font-weight:500">· ${lessonLabel(stLesson)}</span></h3>
 <label>Dạng câu hỏi</label><div class="seg">${[["mc","🔘 Trắc nghiệm"],["tf","✔ Đúng / Sai"],["short","✏ Trả lời ngắn"]].map(([k,t])=>`<button class="${d.type===k?"active":""}" onclick="setType('${k}')">${t}</button>`).join("")}</div>
 <label>${d.type==="tf"?"Phát biểu":"Nội dung câu hỏi"}</label><textarea id="dQ" placeholder="${d.type==="tf"?"Ví dụ: Hai vectơ cùng phương thì luôn cùng hướng.":"Nhập câu hỏi…"}" oninput="draft.question=this.value">${esc(d.question)}</textarea>
 ${ans}
 <details ${extra?"open":""}><summary>💡 Gợi ý & giải thích <span class="muted" style="font-weight:500">(không bắt buộc – hiện cho học sinh khi trả lời sai)</span></summary>
 <label>Gợi ý lần 1 <span class="muted" style="font-weight:500">(sai lần đầu)</span></label><input value="${esc(d.hints[0])}" oninput="draft.hints[0]=this.value">
 <label>Gợi ý lần 2 <span class="muted" style="font-weight:500">(sai lần hai)</span></label><input value="${esc(d.hints[1])}" oninput="draft.hints[1]=this.value">
 <label>Giải thích đáp án</label><textarea style="min-height:70px" oninput="draft.explanation=this.value">${esc(d.explanation)}</textarea></details>
 <div class="actions" style="margin-top:16px"><button class="green" onclick="saveDraft()">💾 ${isEdit?"Cập nhật câu hỏi":"Lưu câu hỏi"}</button><button class="secondary" onclick="resetDraft()">${isEdit?"Hủy sửa":"Làm mới"}</button></div>`}
function setType(k){draft.type=k;if(k==="tf"&&draft.answer>1)draft.answer=0;if(k==="mc"&&draft.options.length<2)draft.options=["","","",""];renderQForm()}
function addOpt(){draft.options.push("");renderQForm()}
function rmOpt(i){draft.options.splice(i,1);if(draft.answer===i)draft.answer=0;else if(draft.answer>i)draft.answer--;renderQForm()}
function resetDraft(){draft=blankDraft();editIdx=null;renderQForm();renderQList()}
function saveDraft(){let d=draft,q={lesson:editIdx!=null?questions[editIdx].lesson:stLesson,type:d.type,question:d.question.trim(),hints:d.hints.map(h=>h.trim()),explanation:d.explanation.trim()};
 if(!q.question)return toast("Hãy nhập nội dung câu hỏi","err");
 if(d.type==="mc"){let filled=d.options.map((o,i)=>({o:o.trim(),i})).filter(x=>x.o);if(filled.length<2)return toast("Cần ít nhất 2 phương án","err");let a=filled.findIndex(x=>x.i===d.answer);if(a<0)return toast("Phương án được chọn làm đáp án đúng đang để trống","err");q.options=filled.map(x=>x.o);q.answer=a}
 else if(d.type==="tf"){q.options=["Đúng","Sai"];q.answer=d.answer}
 else{q.answerText=d.answerText.trim();if(!q.answerText)return toast("Hãy nhập đáp án đúng","err")}
 if(editIdx!=null){questions[editIdx]=q;toast("✅ Đã cập nhật câu hỏi")}else{questions.push(q);toast(`✅ Đã lưu – ${lessonLabel(stLesson)} hiện có ${qCount(stLesson)} câu`)}
 saveQ();editIdx=null;let keepType=d.type;draft=blankDraft();draft.type=keepType;studio().then(()=>document.getElementById("dQ")?.focus())}
function ansText(q){if(q.type==="mc")return `${L[q.answer]}. ${q.options?.[q.answer]??""}`;if(q.type==="tf")return q.answer===0?"Đúng":"Sai";return q.answerText}
function renderQList(){let el=document.getElementById("qList");if(!el)return;let list=questions.map((q,i)=>({q,i})).filter(x=>x.q.lesson===stLesson);
 el.innerHTML=`<h3>Danh sách câu hỏi (${list.length})</h3>${stLesson===12?`<p class="muted">Bài Ôn tập tự động dùng câu hỏi của tất cả các bài, cộng thêm các câu riêng dưới đây.</p>`:""}${list.length?list.map(({q,i},k)=>`<div class="qitem ${editIdx===i?"editing":""}"><div class="qtop"><span class="pill">Câu ${k+1} · ${typeName[q.type]}</span><div class="actions"><button class="iconbtn" title="Lên" onclick="moveQ(${i},-1)" ${k===0?"disabled":""}>↑</button><button class="iconbtn" title="Xuống" onclick="moveQ(${i},1)" ${k===list.length-1?"disabled":""}>↓</button><button class="iconbtn" onclick="editQ(${i})">✏ Sửa</button><button class="iconbtn" title="Nhân bản" onclick="dupQ(${i})">⧉</button><button class="iconbtn del" title="Xóa" onclick="delQ(${i})">🗑</button></div></div><div class="qtext">${esc(q.question)}</div><div class="qans">✔ ${esc(ansText(q))}${q.hints?.some(h=>h)||q.explanation?` <span class="muted">· 💡 có gợi ý/giải thích</span>`:""}</div></div>`).join(""):`<p class="muted">Chưa có câu hỏi. Tạo ở khung bên cạnh, hoặc dùng tab “⚡ Nhập nhanh nhiều câu”.</p>`}`}
function editQ(i){let q=questions[i];editIdx=i;draft={type:q.type,question:q.question||"",options:q.type==="mc"?q.options.slice():["","","",""],answer:q.answer??0,answerText:q.answerText||"",hints:[q.hints?.[0]||"",q.hints?.[1]||""],explanation:q.explanation||""};stTab="questions";stQuestions();document.getElementById("qForm").scrollIntoView({behavior:"smooth",block:"start"})}
function dupQ(i){questions.splice(i+1,0,JSON.parse(JSON.stringify(questions[i])));if(editIdx!=null&&editIdx>i)editIdx++;saveQ();toast("Đã nhân bản câu hỏi");studio()}
function delQ(i){if(!confirm("Xóa câu hỏi này?\n\n“"+questions[i].question+"”"))return;questions.splice(i,1);if(editIdx===i){editIdx=null;draft=null}else if(editIdx!=null&&editIdx>i)editIdx--;saveQ();toast("Đã xóa câu hỏi");studio()}
function moveQ(i,dir){let idx=questions.map((q,k)=>k).filter(k=>questions[k].lesson===questions[i].lesson),p=idx.indexOf(i),j=idx[p+dir];if(j==null)return;[questions[i],questions[j]]=[questions[j],questions[i]];if(editIdx===i)editIdx=j;else if(editIdx===j)editIdx=i;saveQ();renderQList()}

let qMode="manual",aiType="mc",aiResultType="mc",aiN=5,aiLevel="mix",aiExtra="",aiSources=[],aiUseMats={},aiPaste="",aiResults=[],aiHistory=[],aiBusy=null,aiShowManual=false,aiManualText="",aiShowSettings=false,aiStatusHTML="";
const AI_MODELS={gemini:["gemini-3.7-flash","gemini-3.8-flash","gemini-3.5-flash-lite"],claude:["claude-sonnet-5-5","claude-haiku-5-5","claude-opus-5-5"]};

function aiRaw(){try{return JSON.parse(localStorage.getItem("vec_ai")||"{}")}catch(e){return{}}}

function aiStore(p,key,model){let r=aiRaw();r.provider=p;r.keys=r.keys||{};r.models=r.models||{};if(key!=null)r.keys[p]=key.trim();if(model!=null)r.models[p]=model.trim()||AI_MODELS[p][0];localStorage.setItem("vec_ai",JSON.stringify(r))}
function aiUsableMat(m){if(m.kind==="note")return true;if(m.kind!=="file")return false;let k=fkind(m),e=ext(m.name);return k==="pdf"||(k==="image"&&/^(png|jpe?g|webp|gif)$/.test(e))||e==="docx"||e==="pptx"}

/* Đọc tài liệu gốc */
function b64ToBuf(b){let s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer}
async function unzip(buf,filter){let dv=new DataView(buf),u8=new Uint8Array(buf),eocd=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}if(eocd<0)throw new Error("Tệp không đúng định dạng");
 let n=dv.getUint16(eocd+10,true),p=dv.getUint32(eocd+16,true),out={},td=new TextDecoder();
 for(let k=0;k<n;k++){if(dv.getUint32(p,true)!==0x02014b50)break;let method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true),name=td.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
  if(!filter(name))continue;let ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=u8.slice(ds,ds+cs);
  out[name]=method===0?td.decode(data):await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text()}
 return out}
function xmlText(x,para){return x.replace(new RegExp("</"+para+">","g"),"\n").replace(/<w:tab\/>/g,"\t").replace(/<(w|a):br\/>/g,"\n").replace(/<[^>]+>/g,"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&").replace(/\n{3,}/g,"\n\n").trim()}
async function officeText(buf,e){if(e==="docx"){let o=await unzip(buf,n=>n==="word/document.xml");return xmlText(o["word/document.xml"]||"","w:p")}
 let o=await unzip(buf,n=>/^ppt\/slides\/slide\d+\.xml$/.test(n));return Object.keys(o).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/))).map((k,i)=>"[Slide "+(i+1)+"]\n"+xmlText(o[k],"a:p")).join("\n\n")}
async function aiAddFiles(list){for(const f of [...(list||[])]){let e=ext(f.name),k=fkind({name:f.name,mime:f.type});
 try{if(k==="pdf"||(k==="image"&&/^(png|jpe?g|webp|gif)$/.test(e))){let d=await readDataURL(f);aiSources.push({name:f.name,kind:"file",mime:k==="pdf"?"application/pdf":(f.type||EXT_MIME[e]),size:f.size,data:d.split(",")[1]})}
  else if(e==="docx"||e==="pptx"){let t=await officeText(await f.arrayBuffer(),e);if(!t.trim())throw new Error("trống");aiSources.push({name:f.name,kind:"text",text:t})}
  else if(/^(txt|md|csv)$/.test(e)||(f.type||"").startsWith("text/"))aiSources.push({name:f.name,kind:"text",text:await f.text()});
  else toast(`“${f.name}”: chưa hỗ trợ định dạng này. Với .doc/.ppt cũ, hãy lưu lại thành .docx/.pptx hoặc PDF.`,"err")}
 catch(err){console.error(err);toast(`Không đọc được “${f.name}”`,"err")}}
 renderAI()}
async function aiCollect(){let files=[],texts=[];
 for(const x of aiSources){if(x.kind==="text")texts.push({name:x.name,text:x.text});else files.push({name:x.name,mime:x.mime,data:x.data})}
 for(const m of matsOf(stLesson).filter(m=>aiUseMats[m.id]&&aiUsableMat(m))){if(m.kind==="note"){texts.push({name:m.name,text:m.text});continue}
  let k=fkind(m),e=ext(m.name),b64=String(m.data||"").split(",")[1]||"";
  if(k==="pdf")files.push({name:m.name,mime:"application/pdf",data:b64});else if(k==="image")files.push({name:m.name,mime:m.mime||EXT_MIME[e],data:b64});
  else{try{texts.push({name:m.name,text:await officeText(b64ToBuf(b64),e)})}catch(err){throw new Error(`Không đọc được “${m.name}”`)}}}
 if(aiPaste.trim())texts.push({name:"Nội dung dán thêm",text:aiPaste});
 let text=texts.map(t=>`--- ${t.name} ---\n${t.text}`).join("\n\n");if(text.length>200000)text=text.slice(0,200000);
 return{files,text,names:files.map(f=>f.name)}}

async function callAI(prompt,files,signal,maxTok){let c=aiCfg(),r,j;
 try{
  if(c.provider==="gemini"){
   let parts=[...files.map(f=>({inline_data:{mime_type:f.mime,data:f.data}})),{text:prompt}];
   r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model)}:generateContent?key=${encodeURIComponent(c.key)}`,{method:"POST",signal,headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{role:"user",parts}],generationConfig:{temperature:0.7,maxOutputTokens:maxTok||16384}})});
  }else{
   let content=[...files.map(f=>f.mime==="application/pdf"?{type:"document",source:{type:"base64",media_type:f.mime,data:f.data}}:{type:"image",source:{type:"base64",media_type:f.mime,data:f.data}}),{type:"text",text:prompt}];
   r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,headers:{"content-type":"application/json","x-api-key":c.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:c.model,max_tokens:maxTok||8000,messages:[{role:"user",content}]})});
  }
 }catch(e){if(e.name==="AbortError")throw e;throw new Error("Không kết nối được tới máy chủ AI. Hãy kiểm tra mạng Internet.")}
 j=await r.json().catch(()=>({}));
 if(!r.ok){let m=j.error?.message||"";
  if(r.status===400&&/key/i.test(m)||r.status===401||r.status===403)throw new Error("Khóa API không hợp lệ hoặc chưa được cấp quyền. Hãy kiểm tra lại trong ⚙ Cài đặt AI.");
  if(r.status===404)throw new Error(`Không tìm thấy model “${c.model}”. Hãy chọn model khác trong ⚙ Cài đặt AI.`);
  if(r.status===429)throw new Error("Đã hết lượt dùng tạm thời (giới hạn của gói miễn phí). Đợi khoảng 1 phút rồi thử lại, hoặc giảm số câu.");
  if(r.status>=500||r.status===529)throw new Error("Máy chủ AI đang bận. Vui lòng thử lại sau ít phút.");
  throw new Error(m||("Lỗi "+r.status))}
 let text=c.provider==="gemini"?(j.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||"").join(""):(j.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("");
 if(!text.trim())throw new Error(j.promptFeedback?.blockReason?"AI từ chối xử lý nội dung này.":"AI không trả về nội dung. Hãy thử lại.");
 return text}

function cleanAI(t){return String(t).replace(/```[a-z]*\n?/gi,"").replace(/\*\*/g,"").replace(/^#+\s*/gm,"").replace(/^\s*[-•]\s+(?=(câu|đáp án|gợi ý|giải thích))/gim,"")}
const LEVEL_RX=/^\s*[\(\[]?\s*(nhận biết|thông hiểu|vận dụng cao|vận dụng)\s*[\)\]]?\s*[:.\-–]?\s*/i;
function aiLoad(text,type){let{qs,errors}=parseBulk(cleanAI(text));
 if(!qs.length){setStatus(`<div class="feedback help">Không đọc được câu hỏi nào từ kết quả. ${errors.length?esc(errors[0]):"Có thể AI trả lời sai định dạng."} Hãy thử tạo lại.</div>`);renderAIResults();return false}
 aiResults=qs.map(q=>({...q,question:q.question.replace(LEVEL_RX,""),options:q.options?q.options.slice():[],answerText:q.answerText||"",hints:[q.hints?.[0]||"",q.hints?.[1]||""],keep:true}));aiResultType=type;
 let other=qs.filter(q=>q.type!==type).length;
 setStatus(`<div class="feedback good">✅ AI đã tạo <b>${qs.length} câu</b>${qs.length!==aiN?` (yêu cầu ${aiN})`:""}. Hãy kiểm tra, sửa nếu cần rồi bấm <b>💾 Lưu</b> ở cuối danh sách.${other?` <br>Lưu ý: ${other} câu không đúng dạng đã chọn.`:""}${errors.length?` <br>${errors.length} câu sai định dạng đã bị bỏ qua.`:""}</div>`);
 stQuestions();setTimeout(()=>document.getElementById("aiResults")?.scrollIntoView({behavior:"smooth",block:"start"}),50);return true}

async function aiGenerate(){if(aiResults.length)return toast("Hãy lưu hoặc bỏ kết quả lượt trước","err");if(aiBusy)return;
 let c=aiCfg();if(!c.key){aiShowManual=true;renderAI();return toast("Chưa có khóa API – dùng cách “Sao chép lệnh” bên dưới, hoặc mở ⚙ Cài đặt AI.","err")}
 let src;try{src=await aiCollect()}catch(e){return toast(e.message,"err")}
 if(!src.files.length&&!src.text.trim()&&!confirm("Chưa có tài liệu gốc. AI sẽ soạn theo kiến thức chung của bài. Tiếp tục?"))return;
 if(src.files.reduce((a,f)=>a+f.data.length,0)>18*MB)return toast("Tài liệu quá lớn (trên khoảng 13 MB). Hãy bớt tệp hoặc tách phần cần dùng.","err");
 let type=aiType,t0=Date.now(),tick=()=>setStatus(`<div class="aistatus"><span class="spin"></span><span style="flex:1">AI đang đọc tài liệu và biên soạn ${aiN} câu ${typeName[type].toLowerCase()}… ${Math.round((Date.now()-t0)/1000)} giây</span><button class="iconbtn" onclick="aiBusy&&aiBusy.abort()">Hủy</button></div>`);
 aiBusy=new AbortController();renderAI();tick();let timer=setInterval(tick,1000),signal=aiBusy.signal;
 try{let text=await callAI(buildPrompt(src,false),src.files,signal);clearInterval(timer);aiBusy=null;aiLoad(text,type)}
 catch(e){clearInterval(timer);aiBusy=null;if(e.name==="AbortError"){setStatus("");toast("Đã hủy")}else setStatus(`<div class="feedback help">❌ ${esc(e.message)}</div>`);renderAI()}}
async function aiCopyPrompt(){let src;try{src=await aiCollect()}catch(e){return toast(e.message,"err")}let t=buildPrompt(src,true);
 try{await navigator.clipboard.writeText(t)}catch(e){let ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}

   :r.type==="tf"?`<div class="seg tf" style="margin-top:8px"><button class="${r.answer===0?"active t":""}" onclick="aiResults[${k}].answer=0;renderAIResults()">✔ Đúng</button><button class="${r.answer===1?"active f":""}" onclick="aiResults[${k}].answer=1;renderAIResults()">✘ Sai</button></div>`
   :`<label>Đáp án</label><input value="${esc(r.answerText)}" oninput="aiResults[${k}].answerText=this.value">`}
  <details><summary>💡 Gợi ý & giải thích</summary><label>Gợi ý 1</label><input value="${esc(r.hints[0])}" oninput="aiResults[${k}].hints[0]=this.value"><label>Gợi ý 2</label><input value="${esc(r.hints[1])}" oninput="aiResults[${k}].hints[1]=this.value"><label>Giải thích</label><textarea style="min-height:60px" oninput="aiResults[${k}].explanation=this.value">${esc(r.explanation)}</textarea></details></div>`).join("")}
 <div class="savebar actions"><button class="green" id="aiSaveBtn" onclick="aiSave()"></button><button class="secondary" onclick="aiRegenerate()">🔄 Tạo lại</button><button class="danger" onclick="aiDiscard()">Bỏ kết quả</button></div></div>`;aiUpdSave()}
function aiUpdSave(){let b=document.getElementById("aiSaveBtn"),n=aiResults.filter(r=>r.keep).length;if(b){b.textContent=`💾 Lưu ${n} câu vào ${lessonLabel(stLesson)}`;b.disabled=!n}}
function aiSave(){let n=0,bad=0;
 aiResults.filter(r=>r.keep).forEach(r=>{let q={lesson:stLesson,type:r.type,question:String(r.question).trim(),hints:r.hints.map(h=>String(h||"").trim()),explanation:String(r.explanation||"").trim()};
  if(!q.question){bad++;return}
  if(r.type==="mc"){let f=r.options.map((o,i)=>({o:String(o).trim(),i})).filter(x=>x.o),a=f.findIndex(x=>x.i===r.answer);if(f.length<2||a<0){bad++;return}q.options=f.map(x=>x.o);q.answer=a}
  else if(r.type==="tf"){q.options=["Đúng","Sai"];q.answer=r.answer===1?1:0}
  else{q.answerText=String(r.answerText||"").trim();if(!q.answerText){bad++;return}}
  questions.push(q);n++});
 if(!n)return toast("Không có câu hợp lệ để lưu","err");
 saveQ();aiHistory.push({type:aiResultType,n,lesson:stLesson});aiResults=[];
 const order=["mc","tf","short"];aiType=order[(order.indexOf(aiResultType)+1)%3];
 aiStatusHTML=`<div class="feedback good">✅ Đã lưu ${n} câu${bad?` (bỏ qua ${bad} câu thiếu thông tin)`:""}. Mời chọn dạng tiếp theo — đã chuyển sẵn sang <b>${typeName[aiType]}</b>.</div>`;

/* --- Nhập nhanh nhiều câu --- */
const SAMPLE=`Câu 1: Hai vectơ được gọi là bằng nhau khi nào?
A. Có cùng độ dài
*B. Cùng hướng và cùng độ dài
C. Cùng phương
D. Có chung điểm đầu
Gợi ý: Xét cả độ dài và hướng của vectơ.
Giải thích: Hai vectơ bằng nhau khi cùng hướng và cùng độ dài.

Câu 2: Hai vectơ cùng phương thì luôn cùng hướng.
Đáp án: Sai

Câu 3: Vectơ a = (3; 4). Độ dài của vectơ a bằng bao nhiêu?
Đáp án: 5
Gợi ý: |a| = √(x² + y²)`;
const RX_HEAD=/^\s*(?:câu|cau|question)\s*\d+\s*[:.)\-–]?\s*/i,RX_OPT=/^\s*(\*)?\s*([A-F])\s*[.)]\s*(.+?)\s*(\*)?\s*$/,RX_ANS=/^\s*(?:đáp án|dap an|đ\/a|answer)(?:\s*đúng)?\s*[:：]\s*(.+)$/i,RX_HINT=/^\s*(?:gợi ý|goi y|hint)\s*\d*\s*[:：]\s*(.*)$/i,RX_EXP=/^\s*(?:giải thích|giai thich|lời giải|loi giai|explanation)\s*[:：]\s*(.*)$/i;
function cut(s){return s.length>50?s.slice(0,50)+"…":s}
function parseBulk(text){let lines=String(text||"").normalize("NFC").replace(/\r/g,"").split("\n"),blocks=[],cur=[],hasHead=lines.some(l=>RX_HEAD.test(l));
 let started=false;for(const l of lines){if(hasHead){if(RX_HEAD.test(l)){if(cur.length)blocks.push(cur);cur=[l.replace(RX_HEAD,"")];started=true}else if(started)cur.push(l)}else{if(!l.trim()){if(cur.length)blocks.push(cur);cur=[]}else cur.push(l)}}
 if(cur.length)blocks.push(cur);
 let qs=[],errors=[];
 blocks.forEach((bl,bi)=>{let qL=[],opts=[],star=-1,ans=null,hints=[],expl=[],mode="q";
  for(const raw of bl){let l=raw.trim(),m;if(!l)continue;
   if(m=l.match(RX_ANS)){ans=m[1].trim();mode="meta"}
   else if(m=l.match(RX_HINT)){hints.push(m[1].trim());mode="hint"}
   else if(m=l.match(RX_EXP)){expl.push(m[1].trim());mode="exp"}
   else if((mode==="q"||mode==="opt")&&(m=l.match(RX_OPT))&&(mode==="opt"||qL.length)){if(m[1]||m[4])star=opts.length;opts.push(m[3].trim());mode="opt"}
   else if(mode==="q")qL.push(l);else if(mode==="exp")expl.push(l);else if(mode==="hint")hints[hints.length-1]+=" "+l;else if(mode==="opt")opts[opts.length-1]+=" "+l}
  let question=qL.join(" ").trim(),label=question?`“${cut(question)}”`:`Khối ${bi+1}`;
  if(!question){if(opts.length||ans)errors.push(`${label}: không tìm thấy nội dung câu hỏi.`);return}
  let q={type:"",question,hints:hints.slice(0,2),explanation:expl.join(" ").trim()};
  if(opts.length>=2){q.type="mc";q.options=opts.slice(0,6);let a=star;
   if(a<0&&ans){let s=ans.replace(/[.)\s]/g,"");a=/^[A-F]$/i.test(s)?L.indexOf(s.toUpperCase()):opts.findIndex(o=>norm(o)===norm(ans))}
   if(a<0||a>=q.options.length){errors.push(`${label}: chưa đánh dấu đáp án đúng (thêm dấu * trước phương án đúng).`);return}q.answer=a}
  else if(opts.length===1){errors.push(`${label}: chỉ có 1 phương án, cần ít nhất 2.`);return}
  else{if(!ans){errors.push(`${label}: thiếu dòng “Đáp án: …”.`);return}
   if(/^(đúng|dung|đ|true)$/i.test(ans)){q.type="tf";q.options=["Đúng","Sai"];q.answer=0}
   else if(/^(sai|s|false)$/i.test(ans)){q.type="tf";q.options=["Đúng","Sai"];q.answer=1}
   else{q.type="short";q.answerText=ans}}
  qs.push(q)});
 return{qs,errors}}
function stBulk(){document.getElementById("studioBody").innerHTML=`<div class="qgrid"><div class="contentbox"><h3>⚡ Nhập nhanh nhiều câu hỏi</h3><p class="muted">Gõ hoặc dán (copy từ Word được) nhiều câu cùng lúc theo mẫu. Kết quả nhận diện hiện ngay bên cạnh.</p>
 <div class="guide">• Mỗi câu bắt đầu bằng <code>Câu 1:</code>, <code>Câu 2:</code>… (hoặc cách nhau bằng một dòng trống)<br>• <b>Trắc nghiệm:</b> các dòng <code>A.</code> <code>B.</code> <code>C.</code> <code>D.</code>, thêm dấu <code>*</code> trước đáp án đúng (hoặc dòng <code>Đáp án: B</code>)<br>• <b>Đúng/Sai:</b> viết phát biểu, thêm dòng <code>Đáp án: Đúng</code> hoặc <code>Đáp án: Sai</code><br>• <b>Trả lời ngắn:</b> thêm dòng <code>Đáp án: 5</code><br>• Không bắt buộc: <code>Gợi ý: …</code> (tối đa 2 dòng) và <code>Giải thích: …</code></div>
 <textarea id="bulkIn" class="mono" style="min-height:330px;margin-top:12px;font-size:14px;line-height:1.5" placeholder="Câu 1: …&#10;A. …&#10;*B. …&#10;C. …&#10;D. …" oninput="bulkText=this.value;bulkPreview()">${esc(bulkText)}</textarea>
 <div class="actions" style="margin-top:10px"><button class="secondary small" onclick="bulkText=SAMPLE;stBulk()">Chèn ví dụ mẫu</button><button class="secondary small" onclick="bulkText='';stBulk()">Xóa trắng</button></div></div>
 <div class="contentbox sticky"><h3>Xem trước</h3><div id="bulkPrev"></div></div></div>`;bulkPreview()}
function bulkPreview(){let el=document.getElementById("bulkPrev");if(!el)return;if(!bulkText.trim()){el.innerHTML=`<p class="muted">Dán câu hỏi vào khung bên trái. Bấm “Chèn ví dụ mẫu” để xem cách viết.</p>`;return}
 let{qs,errors}=parseBulk(bulkText),c=t=>qs.filter(q=>q.type===t).length;
 el.innerHTML=`<p class="okline">Nhận diện được ${qs.length} câu <span class="muted" style="font-weight:500">(${c("mc")} trắc nghiệm · ${c("tf")} đúng/sai · ${c("short")} trả lời ngắn)</span></p>${errors.map(e=>`<div class="errline">⚠ ${esc(e)}</div>`).join("")}
 ${qs.map((q,k)=>`<div class="qitem"><span class="pill">Câu ${k+1} · ${typeName[q.type]}</span><div class="qtext">${esc(q.question)}</div>${q.type==="mc"?`<div class="muted">${q.options.map((o,j)=>`${j===q.answer?"<b style='color:#166534'>✔ ":""}${L[j]}. ${esc(o)}${j===q.answer?"</b>":""}`).join("<br>")}</div>`:`<div class="qans">✔ ${esc(ansText(q))}</div>`}</div>`).join("")}
 <button class="green" style="margin-top:10px;width:100%" onclick="addBulk()" ${qs.length?"":"disabled"}>➕ Thêm ${qs.length} câu vào ${lessonLabel(stLesson)}</button>`}
function addBulk(){let{qs,errors}=parseBulk(bulkText);if(!qs.length)return;if(errors.length&&!confirm(`Có ${errors.length} câu bị lỗi sẽ không được thêm. Vẫn thêm ${qs.length} câu hợp lệ?`))return;qs.forEach(q=>{q.lesson=stLesson;questions.push(q)});saveQ();bulkText="";stTab="questions";toast(`✅ Đã thêm ${qs.length} câu vào ${lessonLabel(stLesson)}`);studio()}

 document.getElementById("studioBody").innerHTML=`<div class="grid2">
 <div class="contentbox" style="border:2px solid #86efac"><h3>📤 Tạo trang web gửi học sinh</h3><p>Tải về <b>một tệp .html duy nhất</b> chứa sẵn toàn bộ tài liệu và câu hỏi của 6 bài. Gửi tệp này cho học sinh qua Zalo, Google Drive, Classroom…; học sinh mở bằng Chrome/Edge là học được ngay, không cần mạng (trừ video YouTube/Drive).</p>

function bundle(extra){return Object.assign({app:"vecto10",savedAt:Date.now(),questions,materials},extra||{})}
function exportHTML(){let data=bundle({studentOnly:document.getElementById("hideTeacher").checked}),json=JSON.stringify(data).replace(/</g,"\\u003c");
 let html=ORIGINAL_HTML.replace(/(<script id="vec-data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
 download(new Blob([html],{type:"text/html;charset=utf-8"}),"Vecto10-ban-hoc-sinh.html");
 toast(data.studentOnly?"✅ Đã tạo bản cho học sinh. Nếu cần mở lại chế độ giáo viên, thêm #giaovien vào cuối địa chỉ.":"✅ Đã tạo trang web")}
function exportData(){download(new Blob([JSON.stringify(bundle(),null,1)],{type:"application/json"}),"sao-luu-vecto10-"+new Date().toISOString().slice(0,10)+".json");toast("✅ Đã tải tệp sao lưu")}
function importData(file){if(!file)return;let r=new FileReader();r.onload=async()=>{try{let d=JSON.parse(r.result),qs,mats=null;
  if(Array.isArray(d))qs=d;else if(d&&Array.isArray(d.questions)){qs=d.questions;mats=cleanMats(d.materials)}else return toast("Tệp không đúng định dạng","err");
  if(!confirm(`Tệp có ${qs.length} câu hỏi${mats?` và ${mats.length} tài liệu`:""}.\nKhôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?`))return;
  questions=qs;saveQ();if(mats){materials=mats;Object.keys(urlCache).forEach(k=>delete urlCache[k]);try{await idbReplaceAll(mats)}catch(e){toast("Không lưu được tài liệu – bộ nhớ trình duyệt có thể đã đầy.","err")}}
  toast("✅ Đã khôi phục dữ liệu");studio()}catch(e){toast("Không đọc được tệp","err")}};r.readAsText(file)}
async function resetAll(){if(!confirm("Xóa TẤT CẢ câu hỏi và tài liệu, quay về câu hỏi mẫu ban đầu?\nNên tải tệp sao lưu trước."))return;questions=defaultQuestions.map(q=>({...q}));materials=[];try{await idbClear()}catch(e){}saveQ();editIdx=null;draft=null;toast("Đã quay về dữ liệu mẫu");studio()}
