<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học tập Chương IV – Vectơ | Toán 10</title>
<style>
:root{--ink:#172554;--blue:#2563eb;--blue2:#dbeafe;--green:#16a34a;--bg:#f4f7fb;--card:#fff;--muted:#64748b;--border:#e2e8f0;--orange:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#1e293b}
button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;background:var(--blue);color:white;cursor:pointer;font-weight:650}button:hover{filter:brightness(.95)}button.secondary{background:#e2e8f0;color:#1e293b}button.green{background:var(--green)}button.warn{background:#fff7ed;color:#9a3412}button.small{padding:7px 10px;font-size:13px}button:disabled{opacity:.45;cursor:not-allowed;filter:none}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#dbeafe,#eff6ff 50%,#dcfce7)}
.login-card{max-width:460px;width:100%;background:white;border-radius:24px;padding:30px;box-shadow:0 20px 60px #1e40af22}
.logo{font-size:44px;text-align:center}.login-card h1{text-align:center;color:#1d4ed8;margin:5px 0}.login-card p{text-align:center;color:var(--muted)}
label{display:block;font-size:14px;font-weight:650;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:12px;background:white;color:#1e293b}textarea{min-height:85px;resize:vertical}
.app{display:none;min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:#102a56;color:white;padding:20px;overflow:auto}.brand{font-size:18px;font-weight:800;margin-bottom:20px}.brand span{display:block;color:#93c5fd;font-size:12px;font-weight:500;margin-top:3px}
.navbtn{display:block;width:100%;text-align:left;background:transparent;color:#dbeafe;padding:12px;margin:4px 0;border-radius:12px;font-weight:550}.navbtn:hover,.navbtn.active{background:#244778;color:white}.sidebar .mode{margin-top:20px;background:#fbbf24;color:#422006;width:100%}
.main{margin-left:260px;padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.top h2{margin:0;color:var(--ink)}.userchip{background:white;border:1px solid var(--border);border-radius:999px;padding:9px 13px;font-size:14px}
.hero{position:relative;background:linear-gradient(120deg,#1d4ed8,#2563eb,#0f766e);color:white;border-radius:22px;padding:38px 25px 25px;margin-bottom:22px}.hero-author{position:absolute;top:12px;right:20px;font-size:12px;color:#dbeafe;opacity:.9;font-style:italic}.hero-title{font-size:20px;font-weight:800;letter-spacing:1.5px;color:#fde68a;margin-bottom:10px;text-transform:uppercase}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#dbeafe}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 4px 15px #0f172a05}.lesson{cursor:pointer;transition:.15s}.lesson:hover{transform:translateY(-2px);border-color:#93c5fd}.lesson .num{font-size:12px;color:var(--blue);font-weight:800}.lesson h3{margin:8px 0}.muted{color:var(--muted);font-size:14px}.stat{font-size:28px;color:var(--blue);font-weight:800}.pill{display:inline-block;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}
.section{margin:20px 0}.section h3{color:var(--ink)}.hidden{display:none!important}.contentbox{background:white;border:1px solid var(--border);border-radius:18px;padding:22px;margin:15px 0}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.tabs button{background:#e2e8f0;color:#334155}.tabs button.active{background:var(--blue);color:white}.option{display:block;border:1px solid var(--border);border-radius:12px;padding:12px;margin:9px 0;cursor:pointer}.option:hover{border-color:#93c5fd;background:#f8fbff}.feedback{border-radius:14px;padding:14px;margin-top:12px}.feedback.good{background:#dcfce7;color:#166534}.feedback.help{background:#fef3c7;color:#92400e}.feedback.explain{background:#e0f2fe;color:#075985}.teacher{border:2px solid #fbbf24}.table{width:100%;border-collapse:collapse;background:white}.table th,.table td{padding:10px;border-bottom:1px solid var(--border);text-align:left;font-size:14px}.table th{background:#eff6ff;color:#1e40af}.actions{display:flex;gap:8px;flex-wrap:wrap}.foot{font-size:12px;color:var(--muted);margin-top:20px}.teacher>button{margin:14px 8px 0 0}.qrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
@media(max-width:850px){.hero-title{font-size:16px}.hero{padding-top:36px}.sidebar{position:relative;width:auto;bottom:auto}.main{margin-left:0;padding:16px}.top{align-items:flex-start;flex-direction:column}.sidebar nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.brand{margin-bottom:8px}}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="login-card">
  <div class="logo">🧭</div><h1>KHÁM PHÁ VECTƠ</h1><p>Chương IV · Toán học lớp 10</p>
  <label for="studentName">Họ và tên</label><input id="studentName" placeholder="Nhập họ và tên của em">
  <label for="studentClass">Lớp</label><input id="studentClass" placeholder="Ví dụ: 10A1">
  <button class="green" style="width:100%;margin-top:18px" onclick="loginStudent()">Bắt đầu học</button>
  <p style="font-size:12px">Thông tin được lưu trên trình duyệt trong bản thử nghiệm.</p>
 </div>
</div>
<div id="app" class="app">
 <aside class="sidebar">
  <div class="brand">🧭 VECTƠ 10<span>Hệ thống tự học Toán</span></div>
  <nav id="nav"></nav>
  <button class="mode" onclick="toggleTeacher()">⚙ Chế độ giáo viên</button>
  <button class="navbtn" onclick="logout()">↩ Đăng xuất</button>
 </aside>
 <main class="main">
  <div class="top"><h2 id="pageTitle">Trang học tập</h2><div class="userchip" id="userchip"></div></div>
  <div id="view"></div>
 </main>
</div>
<script>
const lessons=[
 {id:7,title:"Các khái niệm mở đầu",pages:"46–50",icon:"➡️"},
 {id:8,title:"Tổng và hiệu của hai vectơ",pages:"51–54",icon:"➕"},
 {id:9,title:"Tích của một vectơ với một số",pages:"55–59",icon:"✖️"},
 {id:10,title:"Vectơ trong mặt phẳng tọa độ",pages:"60–65",icon:"📍"},
 {id:11,title:"Tích vô hướng của hai vectơ",pages:"66–70",icon:"📐"},
 {id:12,title:"Ôn tập cuối chương IV",pages:"71–72",icon:"📝"}
];
const defaultQuestions=[
 {lesson:7,type:"mc",question:"Hai vectơ được gọi là bằng nhau khi nào?",options:["Có cùng độ dài","Cùng hướng và cùng độ dài","Cùng phương","Có chung điểm đầu"],answer:1,hints:["Em hãy xét cả độ dài và hướng của vectơ.","Hai điều kiện cần đồng thời: cùng hướng và cùng độ dài."],explanation:"Hai vectơ bằng nhau khi chúng cùng hướng và có cùng độ dài."},
 {lesson:7,type:"tf",question:"Hai vectơ cùng phương thì luôn cùng hướng.",options:["Đúng","Sai"],answer:1,hints:["Cùng phương có thể cùng chiều hoặc ngược chiều.","Hãy phân biệt cùng phương với cùng hướng."],explanation:"Phát biểu sai. Hai vectơ cùng phương có thể cùng hướng hoặc ngược hướng."},
 {lesson:8,type:"short",question:"Theo quy tắc ba điểm, vectơ AB + vectơ BC bằng vectơ nào? (Nhập AC)",answerText:"AC",hints:["Điểm cuối của vectơ thứ nhất là điểm đầu của vectơ thứ hai.","Đường đi A đến B rồi B đến C tương đương đi trực tiếp A đến C."],explanation:"Theo quy tắc ba điểm: vectơ AB + vectơ BC = vectơ AC."},
 {lesson:9,type:"mc",question:"Nếu k > 0 thì vectơ k·a có hướng như thế nào so với vectơ a (a khác vectơ 0)?",options:["Ngược hướng","Cùng hướng","Vuông góc","Không xác định"],answer:1,hints:["Xét dấu của hệ số k.","Hệ số dương giữ nguyên hướng của vectơ."],explanation:"Với k > 0, vectơ k·a cùng hướng với vectơ a."},
 {lesson:10,type:"short",question:"Vectơ a có tọa độ (3; 4). Độ dài của vectơ a bằng bao nhiêu?",answerText:"5",hints:["Dùng công thức độ dài vectơ trong mặt phẳng tọa độ.","Tính căn bậc hai của tổng bình phương hai tọa độ."],explanation:"|a| = √(3² + 4²) = 5."},
 {lesson:11,type:"mc",question:"Hai vectơ khác vectơ 0 vuông góc thì tích vô hướng bằng:",options:["1","-1","0","Tích độ dài"],answer:2,hints:["Nhớ công thức tích vô hướng theo góc giữa hai vectơ.","Cos 90° bằng 0."],explanation:"Hai vectơ vuông góc có tích vô hướng bằng 0."}
];
let questions=JSON.parse(localStorage.getItem("vec_questions")||"null")||defaultQuestions;
let student=null,teacher=false,currentLesson=7,section="home",qIndex=0,attempts={},scores=JSON.parse(localStorage.getItem("vec_scores")||"[]");
function hero(h,p){return `<div class="hero"><div class="hero-author">Tác giả: Phạm Thu Hường</div><div class="hero-title">HỖ TRỢ TỰ HỌC CHỦ ĐỀ VECTƠ</div><h1>${h}</h1><p>${p}</p></div>`}
function setActive(key){document.querySelectorAll('#nav .navbtn').forEach(b=>b.classList.toggle('active',b.dataset.key===String(key)))}
function saveQ(){localStorage.setItem("vec_questions",JSON.stringify(questions))}
function loginStudent(){let n=document.getElementById("studentName").value.trim(),c=document.getElementById("studentClass").value.trim();if(!n||!c){alert("Vui lòng nhập họ tên và lớp.");return}student={name:n,class:c};document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";document.getElementById("userchip").textContent=n+" · "+c;buildNav();home()}
function logout(){student=null;teacher=false;document.getElementById("app").style.display="none";document.getElementById("login").style.display="grid"}
function buildNav(){let n=document.getElementById("nav");n.innerHTML=`<button class="navbtn" data-key="home" onclick="home()">🏠 Trang chủ</button>`+lessons.map(l=>`<button class="navbtn" data-key="${l.id}" onclick="openLesson(${l.id})">${l.icon} Bài ${l.id===12?"Ôn tập":l.id} · ${l.title}</button>`).join("")+`<button class="navbtn" data-key="report" onclick="report()">📊 Kết quả của em</button>`}
function home(){section="home";setActive("home");document.getElementById("pageTitle").textContent="Trang học tập";let done=JSON.parse(localStorage.getItem("vec_done_"+student.name)||"[]");document.getElementById("view").innerHTML=`${hero(`Xin chào, ${esc(student.name)}! 👋`,"Hãy chọn bài học và khám phá thế giới vectơ.")}<div class="grid"><div class="card"><div class="muted">Bài học trong chương</div><div class="stat">6</div></div><div class="card"><div class="muted">Bài đã hoàn thành</div><div class="stat">${done.length}/6</div></div><div class="card"><div class="muted">Lớp học</div><div class="stat">${esc(student.class)}</div></div></div><div class="section"><h3>📚 Các bài học</h3><div class="grid">${lessons.map(l=>`<div class="card lesson" onclick="openLesson(${l.id})"><div class="num">BÀI ${l.id===12?"ÔN TẬP":l.id}</div><h3>${l.icon} ${l.title}</h3><div class="muted">SGK trang ${l.pages}</div><div style="margin-top:14px"><span class="pill">Học · Luyện tập · Kiểm tra</span></div></div>`).join("")}</div></div>${teacher?teacherPanel():""}`}
function openLesson(id){currentLesson=id;section="lesson";setActive(id);let l=lessons.find(x=>x.id===id);document.getElementById("pageTitle").textContent="Bài "+(id===12?"ôn tập":id)+": "+l.title;document.getElementById("view").innerHTML=`${hero(`${l.icon} Bài ${id===12?"Ôn tập cuối chương IV":id+". "+l.title}`,`SGK trang ${l.pages} · Tự học theo tiến trình`)}<div class="tabs"><button class="active" onclick="lessonTab('materials',this)">📖 Tài liệu</button><button onclick="lessonTab('practice',this)">✍️ Luyện tập</button><button onclick="lessonTab('test',this)">📝 Kiểm tra</button></div><div id="lessonBody"></div>${teacher?teacherPanel():""}`;lessonTab("materials")}
function lessonTab(which,btn){section=which;document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));if(!btn)btn=document.querySelector(`.tabs button[onclick*="${which}"]`);if(btn)btn.classList.add("active");let b=document.getElementById("lessonBody");if(!b)return;if(which==="materials"){b.innerHTML=`<div class="contentbox"><h3>📖 Tài liệu học tập</h3><p>Giáo viên có thể bổ sung tài liệu PDF, hình ảnh, video hoặc nội dung hướng dẫn tại chế độ thiết kế.</p><div class="card"><h4>🧠 Nội dung cần học</h4><p>Đọc nội dung SGK trang ${lessons.find(x=>x.id===currentLesson).pages}, ghi lại kiến thức trọng tâm và xem tài liệu giáo viên cung cấp.</p></div><div class="card" style="margin-top:12px"><h4>🎯 Mục tiêu tự học</h4><p>Hiểu kiến thức trọng tâm, hoàn thành luyện tập và tự kiểm tra mức độ nắm bài.</p></div></div>`}else if(which==="practice"){renderPractice()}else if(which==="test"){renderTest()}}
function getLessonQs(id){return questions.filter(q=>q.lesson===id||id===12)}
function renderPractice(){let b=document.getElementById("lessonBody");let qs=getLessonQs(currentLesson);if(!qs.length){b.innerHTML=`<div class="contentbox">Chưa có câu hỏi luyện tập cho bài này. Giáo viên có thể thêm câu hỏi trong chế độ thiết kế.</div>`;return}qIndex=0;renderQuestion(qs,0)}
function renderQuestion(qs,i){let q=qs[i],key=currentLesson+"_"+i,tries=attempts[key]||0;let b=document.getElementById("lessonBody");b.innerHTML=`<div class="contentbox"><div class="pill">Câu ${i+1}/${qs.length} · ${q.type==="mc"?"Trắc nghiệm":q.type==="tf"?"Đúng/Sai":"Trả lời ngắn"}</div><h3>${esc(q.question)}</h3>${q.type==="short"?`<input id="answer" placeholder="Nhập câu trả lời">`:q.options.map((o,j)=>`<label class="option"><input type="radio" name="ans" value="${j}" style="width:auto;margin-right:9px"> ${esc(o)}</label>`).join("")}<div class="actions" style="margin-top:12px"><button onclick="checkAnswer(${i})">Kiểm tra câu trả lời</button><button class="secondary" onclick="renderQuestion(getLessonQs(currentLesson),${i+1})" ${i>=qs.length-1?"disabled":""}>Câu tiếp theo →</button></div><div id="feedback"></div></div>`}
function checkAnswer(i){let qs=getLessonQs(currentLesson),q=qs[i],key=currentLesson+"_"+i,tries=attempts[key]||0,correct=false;if(q.type==="short"){let val=(document.getElementById("answer").value||"").trim().toLowerCase().replace(/\s/g,"");correct=val===String(q.answerText||"").trim().toLowerCase().replace(/\s/g,"")}else{let selected=document.querySelector('input[name="ans"]:checked');correct=selected&&Number(selected.value)===q.answer}let f=document.getElementById("feedback");if(correct){f.innerHTML=`<div class="feedback good"><b>🎉 Chính xác!</b><br>${esc(q.explanation||"Em đã trả lời đúng.")}</div>`;attempts[key]=0;recordResponse(currentLesson,q,true,tries+1)}else{tries++;attempts[key]=tries;let hint=tries<=2?(q.hints?.[tries-1]||"Em hãy xem lại nội dung kiến thức liên quan."):(q.explanation||"Hãy xem lại phần lý thuyết và thử lại.");f.innerHTML=`<div class="feedback help"><b>Chưa chính xác – hãy thử lại!</b><br>${esc(hint)}${tries>=3?`<div style="margin-top:8px"><b>Giải thích:</b> ${esc(q.explanation||"")}</div>`:""}</div>`;recordResponse(currentLesson,q,false,tries)}}
function recordResponse(id,q,correct,attempt){scores.push({name:student.name,class:student.class,lesson:id,question:q.question,correct,attempt,date:new Date().toLocaleString()});localStorage.setItem("vec_scores",JSON.stringify(scores))}
function renderTest(){let qs=getLessonQs(currentLesson);if(!qs.length){document.getElementById("lessonBody").innerHTML=`<div class="contentbox">Chưa có câu hỏi kiểm tra cho bài này. Giáo viên hãy thêm câu hỏi.</div>`;return}document.getElementById("lessonBody").innerHTML=`<div class="contentbox"><h3>📝 Bài kiểm tra</h3><p>Phiên bản thử nghiệm: kiểm tra sử dụng câu hỏi đã có trong ngân hàng. Gợi ý không hiển thị trong chế độ kiểm tra.</p><button onclick="startTest()">Bắt đầu kiểm tra (${qs.length} câu)</button></div>`}
function startTest(){let qs=getLessonQs(currentLesson);let html=`<div class="contentbox"><h3>📝 Bài kiểm tra</h3><form id="testForm">`;qs.forEach((q,i)=>{html+=`<div class="section"><b>Câu ${i+1}. ${esc(q.question)}</b>${q.type==="short"?`<input name="q${i}" placeholder="Câu trả lời">`:q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" style="width:auto;margin-right:8px"> ${esc(o)}</label>`).join("")}</div>`});html+=`</form><button onclick="submitTest()">Nộp bài</button><div id="testResult"></div></div>`;document.getElementById("lessonBody").innerHTML=html}
function submitTest(){let qs=getLessonQs(currentLesson),correct=0;qs.forEach((q,i)=>{let val;if(q.type==="short"){val=(document.querySelector(`[name="q${i}"]`)?.value||"").trim().toLowerCase().replace(/\s/g,"");correct+=val===String(q.answerText||"").toLowerCase().replace(/\s/g,"")?1:0}else{let selected=document.querySelector(`[name="q${i}"]:checked`);correct+=selected&&Number(selected.value)===q.answer?1:0}});let pct=Math.round(correct/qs.length*100);document.getElementById("testResult").innerHTML=`<div class="feedback good"><h3>Kết quả: ${correct}/${qs.length} câu (${pct}%)</h3><p>Hãy xem lại những câu chưa đúng ở phần luyện tập.</p></div>`;let done=JSON.parse(localStorage.getItem("vec_done_"+student.name)||"[]");if(!done.includes(currentLesson)){done.push(currentLesson);localStorage.setItem("vec_done_"+student.name,JSON.stringify(done))}scores.push({name:student.name,class:student.class,lesson:currentLesson,test:true,correct,total:qs.length,pct,date:new Date().toLocaleString()});localStorage.setItem("vec_scores",JSON.stringify(scores))}
function report(){setActive("report");document.getElementById("pageTitle").textContent="Kết quả học tập";let mine=scores.filter(s=>s.name===student.name);document.getElementById("view").innerHTML=`${hero("📊 Kết quả học tập","Thông tin ghi nhận trên trình duyệt hiện tại")}<div class="contentbox"><h3>Lịch sử hoạt động</h3>${mine.length?`<table class="table"><thead><tr><th>Thời điểm</th><th>Bài</th><th>Hoạt động</th><th>Kết quả</th></tr></thead><tbody>${mine.map(s=>`<tr><td>${esc(s.date||"")}</td><td>${s.lesson}</td><td>${s.test?"Kiểm tra": "Luyện tập"}</td><td>${s.test?`${s.correct}/${s.total} (${s.pct}%)`:s.correct?"Đúng":"Sai"}</td></tr>`).join("")}</tbody></table>`:"Chưa có dữ liệu hoạt động."}</div>`}
function toggleTeacher(){teacher=!teacher;home();if(teacher)document.getElementById("pageTitle").textContent="Chế độ giáo viên – thiết kế"}
function teacherPanel(){return `<div class="contentbox teacher"><h3>⚙ Chế độ giáo viên – thiết kế nội dung</h3><p class="muted">Thêm câu hỏi cho bài đang chọn. Dữ liệu câu hỏi được lưu trên trình duyệt này.</p><label>Dạng câu hỏi</label><select id="newType" onchange="toggleFields()"><option value="mc">Trắc nghiệm</option><option value="tf">Đúng/Sai</option><option value="short">Trả lời ngắn</option></select><label>Nội dung câu hỏi</label><textarea id="newQuestion" placeholder="Nhập nội dung câu hỏi"></textarea><div id="newOptions"><label>Đáp án A</label><input id="opt0"><label>Đáp án B</label><input id="opt1"><label>Đáp án C</label><input id="opt2"><label>Đáp án D</label><input id="opt3"><label>Đáp án đúng (0=A, 1=B, 2=C, 3=D)</label><input id="newAnswer" type="number" min="0" max="3" value="0"></div><div id="shortBox" class="hidden"><label>Đáp án ngắn</label><input id="newAnswerText"></div><label>Gợi ý lần 1</label><textarea id="hint1"></textarea><label>Gợi ý lần 2</label><textarea id="hint2"></textarea><label>Giải thích</label><textarea id="newExplain"></textarea><button class="green" onclick="addQuestion()">Lưu câu hỏi</button><button class="secondary" onclick="exportData()">Xuất dữ liệu JSON</button><label>Nhập dữ liệu câu hỏi JSON</label><input type="file" accept=".json" onchange="importData(event)"><h4>Câu hỏi hiện có trong bài</h4><div id="teacherQs">${questions.filter(q=>q.lesson===currentLesson).map(q=>`<div class="card qrow" style="margin:8px 0"><b>${esc(q.question)}</b><button class="warn small" onclick="deleteQuestion(${questions.indexOf(q)})">Xóa</button></div>`).join("")||"Chưa có câu hỏi"}</div></div>`}
function toggleFields(){let t=document.getElementById('newType').value;document.getElementById('shortBox').classList.toggle('hidden',t!=='short');document.getElementById('newOptions').classList.toggle('hidden',t==='short');[0,1,2,3].forEach(i=>{let el=document.getElementById('opt'+i);el.classList.toggle('hidden',t==='tf');el.previousElementSibling.classList.toggle('hidden',t==='tf')});let n=document.getElementById('newAnswer');n.max=t==='tf'?1:3;n.previousElementSibling.textContent=t==='tf'?'Đáp án đúng (0 = Đúng, 1 = Sai)':'Đáp án đúng (0=A, 1=B, 2=C, 3=D)'}
function addQuestion(){let type=document.getElementById("newType").value,q={lesson:currentLesson,type,question:document.getElementById("newQuestion").value.trim(),hints:[document.getElementById("hint1").value,document.getElementById("hint2").value],explanation:document.getElementById("newExplain").value};if(!q.question){alert("Nhập nội dung câu hỏi");return}if(type==="mc"){q.options=[0,1,2,3].map(i=>document.getElementById("opt"+i).value);q.answer=Number(document.getElementById("newAnswer").value)}else if(type==="tf"){q.options=["Đúng","Sai"];q.answer=Number(document.getElementById("newAnswer").value||0)}else{q.answerText=document.getElementById("newAnswerText").value.trim();if(!q.answerText){alert("Nhập đáp án ngắn");return}}questions.push(q);saveQ();openLesson(currentLesson);alert("Đã lưu câu hỏi!")}
function deleteQuestion(index){if(confirm("Xóa câu hỏi này?")){questions.splice(index,1);saveQ();openLesson(currentLesson)}}
function exportData(){let blob=new Blob([JSON.stringify(questions,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ngan-hang-cau-hoi-vecto.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(Array.isArray(data)){questions=data;saveQ();openLesson(currentLesson);alert("Đã nhập dữ liệu")}else alert("Tệp không đúng định dạng")}catch{alert("Không đọc được JSON")}};reader.readAsText(file)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script>
</body>
</html>
