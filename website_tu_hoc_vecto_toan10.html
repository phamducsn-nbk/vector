 {lesson:7,type:"mc",question:"Hai vectơ được gọi là bằng nhau khi nào?",options:["Có cùng độ dài","Cùng hướng và cùng độ dài","Cùng phương","Có chung điểm đầu"],answer:1,hints:["Em hãy xét cả độ dài và hướng của vectơ.","Hai điều kiện cần đồng thời: cùng hướng và cùng độ dài."],explanation:"Hai vectơ bằng nhau khi chúng cùng hướng và có cùng độ dài."},
 {lesson:7,type:"tf",question:"Cho ba điểm A, B, C phân biệt và thẳng hàng. Xét tính đúng sai của các mệnh đề sau:",items:[{text:"Vectơ AB và vectơ AC cùng phương.",answer:true},{text:"Hai vectơ cùng phương thì luôn cùng hướng.",answer:false},{text:"Vectơ-không cùng phương với mọi vectơ.",answer:true},{text:"Độ dài vectơ AB bằng độ dài vectơ BA.",answer:true}],hints:["Ba điểm thẳng hàng thì các vectơ tạo bởi chúng cùng phương.","Cùng phương có thể cùng hướng hoặc ngược hướng."],explanation:"a) Đúng vì A, B, C thẳng hàng. b) Sai: cùng phương có thể ngược hướng. c) Đúng theo quy ước. d) Đúng: |AB| = |BA| = AB."},
 {lesson:8,type:"mc",question:"Theo quy tắc ba điểm, vectơ AB + vectơ BC bằng",options:["vectơ AC","vectơ CA","vectơ BA","vectơ 0"],answer:0,hints:["Điểm cuối của vectơ thứ nhất là điểm đầu của vectơ thứ hai.","Đi từ A đến B rồi từ B đến C cũng như đi thẳng từ A đến C."],explanation:"Theo quy tắc ba điểm: vectơ AB + vectơ BC = vectơ AC."},
 {lesson:8,type:"tf",question:"Cho hình bình hành ABCD tâm O. Xét tính đúng sai của các mệnh đề sau:",items:[{text:"vectơ AB + vectơ AD = vectơ AC",answer:true},{text:"vectơ AB = vectơ CD",answer:false},{text:"vectơ OA + vectơ OC = vectơ 0",answer:true},{text:"vectơ AB − vectơ AD = vectơ BD",answer:false}],hints:["Nhớ quy tắc hình bình hành và tính chất trung điểm.","Hai vectơ đối nhau có cùng độ dài nhưng ngược hướng."],explanation:"a) Đúng (quy tắc hình bình hành). b) Sai vì vectơ AB = vectơ DC. c) Đúng vì O là trung điểm AC. d) Sai vì AB − AD = DB."},
 {lesson:9,type:"mc",question:"Nếu k > 0 thì vectơ k·a có hướng như thế nào so với vectơ a (a khác vectơ 0)?",options:["Ngược hướng","Cùng hướng","Vuông góc","Không xác định"],answer:1,hints:["Xét dấu của hệ số k.","Hệ số dương giữ nguyên hướng của vectơ."],explanation:"Với k > 0, vectơ k·a cùng hướng với vectơ a."},
 {lesson:10,type:"mc",question:"Vectơ a có tọa độ (3; 4). Độ dài của vectơ a bằng",options:["5","7","25","1"],answer:0,hints:["Dùng công thức độ dài vectơ trong mặt phẳng tọa độ.","|a| = √(x² + y²)."],explanation:"|a| = √(3² + 4²) = √25 = 5."},
 {lesson:11,type:"mc",question:"Hai vectơ khác vectơ 0 vuông góc thì tích vô hướng bằng",options:["1","−1","0","Tích độ dài"],answer:2,hints:["Nhớ công thức tích vô hướng theo góc giữa hai vectơ.","cos 90° bằng 0."],explanation:"Hai vectơ vuông góc có tích vô hướng bằng 0."}
];
const L="ABCDEF",MB=1024*1024;
const typeName={mc:"Trắc nghiệm",tf:"Đúng/Sai",short:"Trả lời ngắn (cũ)"};
const TF_STEM="Xét tính đúng sai của các mệnh đề sau:",AB="abcd";
const usable=q=>q&&(q.type==="mc"||q.type==="tf");
function migrateQ(q){if(q&&q.type==="tf"&&!Array.isArray(q.items)){let{options,answer,...r}=q;return{...r,question:"Xét tính đúng sai của phát biểu sau:",items:[{text:q.question,answer:q.answer!==1}]}}return q}
function tfPoints(nc,n){if(n===4)return[0,0.1,0.25,0.5,1][nc];return n?nc/n:0}
const fmtPts=n=>String(Math.round(n*100)/100).replace(".",",");

/* ===== Lưu trữ: câu hỏi trong localStorage, tài liệu (tệp lớn) trong IndexedDB ===== */
let dbp=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{let r=indexedDB.open("vec10",1);r.onupgradeneeded=()=>r.result.createObjectStore("materials",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}
async function idb(mode,fn){let d=await db();return new Promise((res,rej)=>{let tx=d.transaction("materials",mode),st=tx.objectStore("materials"),r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
const idbAll=()=>idb("readonly",s=>s.getAll()),idbPut=m=>idb("readwrite",s=>s.put(m)),idbDel=id=>idb("readwrite",s=>s.delete(id)),idbClear=()=>idb("readwrite",s=>s.clear());
async function idbReplaceAll(list){await idbClear();for(const m of list)await idbPut(m)}

const EMB=(()=>{try{return JSON.parse(document.getElementById("vec-data").textContent)}catch(e){return null}})();
const STUDENT_ONLY=!!(EMB&&EMB.studentOnly)&&location.hash!=="#giaovien";
let questions=[],materials=[];
function cleanMats(list){return (list||[]).map(m=>({...m,id:String(m.id||newId()).replace(/[^\w-]/g,"")}))}
let CFG=(()=>{try{return JSON.parse(localStorage.getItem("vec_cfg")||"{}")}catch(e){return{}}})();
function saveCfg(){localStorage.setItem("vec_cfg",JSON.stringify(CFG))}
const ready=(async()=>{
 let localAt=Number(localStorage.getItem("vec_savedAt")||0);
 if(EMB&&EMB.savedAt>localAt){
  questions=EMB.questions||[];materials=cleanMats(EMB.materials);if(EMB.cfg){CFG={...CFG,syncUrl:EMB.cfg.syncUrl||""};saveCfg()}
  localStorage.setItem("vec_questions",JSON.stringify(questions));localStorage.setItem("vec_savedAt",String(EMB.savedAt));
  try{await idbReplaceAll(materials)}catch(e){console.warn(e)}
 }else{
  questions=JSON.parse(localStorage.getItem("vec_questions")||"null")||defaultQuestions.map(q=>({...q}));
  try{materials=cleanMats(await idbAll())}catch(e){materials=[]}
 }
 questions=questions.map(migrateQ);
})();

function saveQ(){localStorage.setItem("vec_questions",JSON.stringify(questions));touch()}

let student=null,teacher=false,currentLesson=7,section="home",attempts={},scores=JSON.parse(localStorage.getItem("vec_scores")||"[]");

/* ===== Tiện ích chung ===== */
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const VEC_RX=/\\(?:vec|overrightarrow)\s*\{([^{}]{1,12})\}|\\vec\s+([A-Za-z0-9])/g;
function mx(s){return esc(s).replace(VEC_RX,(m,a,b)=>`<span class="vec">${a??b}</span>`)}
const VTOK="(?:[A-Z]{1,3}|[A-Z][0-9]|[a-z][0-9]?|0)(?![\\p{L}\\p{N}'’·*])",VWORD="(?:[Vv]ectơ|[Vv]ecto|[Vv]éctơ|[Vv]éc-tơ|[Vv]ector|VECTƠ)";
const PLAIN_RX=new RegExp(VWORD+"\\s+("+VTOK+"(?:\\s*(?:,|và|hoặc)\\s*"+VTOK+")*)","gu"),TOK_RX=new RegExp(VTOK,"gu");
function convVec(x){let s=String(x??""),n=0;
 s=s.replace(/\$([^$]{1,80})\$/g,(m,inner)=>/\\(vec|overrightarrow)/.test(inner)?(n++,inner):m);
 s=s.replace(/\\overrightarrow\s*\{/g,()=>{n++;return"\\vec{"});
 s=s.replace(/([A-Za-z]{1,3})⃗/g,(m,a)=>{n++;return`\\vec{${a}}`});
 s=s.replace(PLAIN_RX,(m,list)=>{n++;return list.replace(TOK_RX,k=>`\\vec{${k}}`)});
 return{s,n}}
const SUS_TOK=/(?<![\p{L}\p{N}{\\])([A-Z]{2})(?![\p{L}\p{N}}])/gu;
function susVec(x){let s=String(x??""),plain=s.replace(VEC_RX,"□");if(!/(?<![\p{L}])[A-Z]{2}\s*[+\-−=]|[+\-−=]\s*[A-Z]{2}(?![\p{L}])/u.test(plain))return null;let toks=[...new Set([...plain.matchAll(SUS_TOK)].map(m=>m[1]))];if(!toks.length)return null;return{s:s.replace(SUS_TOK,k=>`\\vec{${k}}`),toks}}
function qFields(q){let f=[["question","Câu hỏi"]];if(q.type==="mc")(q.options||[]).forEach((_,i)=>f.push([["options",i],"Phương án "+L[i]]));if(q.type==="tf")(q.items||[]).forEach((_,i)=>f.push([["items",i,"text"],"Ý "+AB[i]+")"]));f.push([["hints",0],"Gợi ý 1"],[["hints",1],"Gợi ý 2"],["explanation","Giải thích"]);return f}
function getF(q,k){return typeof k==="string"?q[k]:k.length===2?(q[k[0]]||[])[k[1]]:((q[k[0]]||[])[k[1]]||{})[k[2]]}
function setF(q,k,v){if(typeof k==="string")q[k]=v;else if(k.length===2){q[k[0]]=q[k[0]]||[];q[k[0]][k[1]]=v}else q[k[0]][k[1]][k[2]]=v}
function convQ(q){let c=JSON.parse(JSON.stringify(q));for(const[k]of qFields(c)){let v=getF(c,k);if(v)setF(c,k,convVec(v).s)}return c}
function hero(h,p,cls){let st=statsHTML();return `<div class="hero ${cls||""}"><div class="hero-top"><span class="hero-stats ${st?"":"hidden"}" title="Thống kê truy cập toàn trang">${st}</span><div class="hero-author">Tác giả: Phạm Thu Hường</div></div><div class="hero-title">HỖ TRỢ TỰ HỌC CHỦ ĐỀ VECTƠ</div><h1>${h}</h1><p>${p}</p></div>`}
function setActive(key){document.querySelectorAll('#nav .navbtn').forEach(b=>b.classList.toggle('active',b.dataset.key===String(key)))}
let toastTimer;function toast(msg,type){let t=document.getElementById("toast");t.textContent=msg;t.className="toast show "+(type||"");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className="toast",3200)}
function newId(){return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function lessonById(id){return lessons.find(x=>x.id===id)}
function lessonLabel(id){return id===12?"Ôn tập":"Bài "+id}
function matsOf(id){return materials.filter(m=>m.lesson===id).sort((a,b)=>a.order-b.order)}
function qCount(id){return questions.filter(q=>q.lesson===id&&usable(q)).length}
function fmtSize(b){b=b||0;return b>=MB?(b/MB).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB"}
function download(blob,name){let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function norm(s){return String(s??"").normalize("NFC").toLowerCase().replace(/vectơ|vecto|vector/g,"").replace(/[\s→⃗]/g,"").replace(/,/g,".")}
function safeUrl(u){u=String(u||"").trim();if(!/^https?:\/\//i.test(u))u="https://"+u.replace(/^\/+/,"");return u}
function ytId(u){let m=String(u||"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);return m&&m[1]}
function driveId(u){let m=String(u||"").match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]{10,})/);return m&&m[1]}
const EXT_MIME={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",svg:"image/svg+xml",mp4:"video/mp4",webm:"video/webm",mov:"video/quicktime",mp3:"audio/mpeg",wav:"audio/wav",m4a:"audio/mp4"};
function ext(name){return (String(name).split(".").pop()||"").toLowerCase()}
function fkind(m){let t=m.mime||"",e=ext(m.name);
 if(t.startsWith("image/")||/^(png|jpe?g|gif|webp|svg|bmp)$/.test(e))return"image";
 if(t==="application/pdf"||e==="pdf")return"pdf";
 if(t.startsWith("video/")||/^(mp4|webm|ogv|mov|m4v)$/.test(e))return"video";
 if(t.startsWith("audio/")||/^(mp3|wav|ogg|m4a|aac)$/.test(e))return"audio";
 if(/^(docx?|odt|rtf)$/.test(e))return"word";if(/^(pptx?|odp)$/.test(e))return"ppt";if(/^(xlsx?|ods|csv)$/.test(e))return"excel";return"other"}
const ICON={image:"🖼️",pdf:"📕",video:"🎬",audio:"🎧",word:"📘",ppt:"📙",excel:"📗",other:"📎",link:"🔗",yt:"▶️",drive:"📁",note:"📝"};
const KNAME={image:"Ảnh",pdf:"PDF",video:"Video",audio:"Âm thanh",word:"Word",ppt:"PowerPoint",excel:"Bảng tính",other:"Tệp"};
function micon(m){if(m.kind==="note")return ICON.note;if(m.kind==="link")return ytId(m.url)?ICON.yt:driveId(m.url)?ICON.drive:ICON.link;return ICON[fkind(m)]}
function mdesc(m){if(m.kind==="note")return"Ghi chú · "+(m.text||"").length+" ký tự";if(m.kind==="link")return ytId(m.url)?"Video YouTube":driveId(m.url)?"Google Drive":m.url;return KNAME[fkind(m)]+" · "+fmtSize(m.size)}
const urlCache={};
function blobUrl(m){if(urlCache[m.id])return urlCache[m.id];let [h,b]=String(m.data||",").split(","),bin=atob(b||""),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return urlCache[m.id]=URL.createObjectURL(new Blob([arr],{type:m.mime||EXT_MIME[ext(m.name)]||"application/octet-stream"}))}

function loginStudent(){let n=document.getElementById("studentName").value.trim(),c=document.getElementById("studentClass").value.trim();if(!n||!c){alert("Vui lòng nhập họ tên và lớp.");return}student={name:n,class:c};startSession();document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";document.getElementById("userchip").textContent=n+" · "+c;buildNav();home()}
function logout(){if(!leaveTest())return;endSession();adminOK=false;try{sessionStorage.removeItem("vec_admin")}catch(e){}student=null;teacher=false;updateModeBtn();document.getElementById("app").style.display="none";document.getElementById("login").style.display="grid"}
function buildNav(){let n=document.getElementById("nav");n.innerHTML=`<button class="navbtn" data-key="home" onclick="home()">🏠 Trang chủ</button>`+lessons.map(l=>`<button class="navbtn" data-key="${l.id}" onclick="navLesson(${l.id})">${l.icon} Bài ${l.id===12?"Ôn tập":l.id} · ${l.title}</button>`).join("")+`<button class="navbtn" data-key="report" onclick="report()">📊 Kết quả của em</button>`}
function navLesson(id){if(teacher){stLesson=id;editIdx=null;draft=null;studio()}else openLesson(id)}
function home(){if(!leaveTest())return;if(teacher)return studio();section="home";setActive("home");document.getElementById("pageTitle").textContent="Trang học tập";let done=JSON.parse(localStorage.getItem("vec_done_"+student.name)||"[]");document.getElementById("view").innerHTML=`${hero(`Xin chào, ${esc(student.name)}! 👋`,"Hãy chọn bài học và khám phá thế giới vectơ.")}<div class="grid"><div class="card"><div class="muted">Bài học trong chương</div><div class="stat">6</div></div><div class="card"><div class="muted">Bài đã hoàn thành</div><div class="stat">${done.length}/6</div></div><div class="card"><div class="muted">Lớp học</div><div class="stat">${esc(student.class)}</div></div></div><div class="section"><h3>📚 Các bài học</h3><div class="grid">${lessons.map(l=>`<div class="card lesson" onclick="openLesson(${l.id})"><div class="num">BÀI ${l.id===12?"ÔN TẬP":l.id}</div><h3>${l.icon} ${l.title}</h3><div class="muted">SGK trang ${l.pages}</div><div style="margin-top:14px"><span class="pill">Học · Luyện tập · Kiểm tra</span></div></div>`).join("")}</div></div>`}
function openLesson(id){if(!leaveTest())return;currentLesson=id;section="lesson";setActive(id);let l=lessonById(id);document.getElementById("pageTitle").textContent="Bài "+(id===12?"ôn tập":id)+": "+l.title;document.getElementById("view").innerHTML=`${hero(`${l.icon} Bài ${id===12?"Ôn tập cuối chương IV":id+". "+l.title}`,`SGK trang ${l.pages} · Tự học theo tiến trình`)}<div class="tabs"><button onclick="lessonTab('materials',this)">📖 Tài liệu</button><button onclick="lessonTab('practice',this)">✍️ Luyện tập</button><button onclick="lessonTab('test',this)">📝 Kiểm tra</button></div><div id="lessonBody"></div>`;lessonTab("materials")}
function lessonTab(which,btn){if(!leaveTest())return;section=which;document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));if(!btn)btn=document.querySelector(`.tabs button[onclick*="${which}"]`);if(btn)btn.classList.add("active");let b=document.getElementById("lessonBody");if(!b)return;if(which==="materials"){b.innerHTML=`<div class="contentbox muted">Đang tải tài liệu…</div>`;ready.then(()=>{let el=document.getElementById("lessonBody");if(el&&section==="materials")el.innerHTML=materialsHTML(currentLesson)})}else if(which==="practice"){renderPractice()}else if(which==="test"){renderTest()}}
function materialsHTML(id){let mats=matsOf(id),l=lessonById(id);return `<div class="contentbox"><h3>📖 Tài liệu học tập</h3>${mats.length?mats.map(materialView).join(""):`<p class="muted">Giáo viên chưa thêm tài liệu cho bài này.</p>`}<div class="grid" style="margin-top:14px"><div class="card"><h4 style="margin-top:0">🧠 Nội dung cần học</h4><p style="margin-bottom:0">Đọc nội dung SGK trang ${l.pages}, ghi lại kiến thức trọng tâm và xem tài liệu giáo viên cung cấp.</p></div><div class="card"><h4 style="margin-top:0">🎯 Mục tiêu tự học</h4><p style="margin-bottom:0">Hiểu kiến thức trọng tâm, hoàn thành luyện tập và tự kiểm tra mức độ nắm bài.</p></div></div></div>`}
function materialView(m){
 let head=extra=>`<div class="mview-h"><span style="font-size:22px">${micon(m)}</span><b>${esc(m.name)}</b><span class="spacer"></span>${extra||""}</div>`;
 if(m.kind==="note")return `<div class="mview">${head()}<div class="note">${mx(m.text)}</div></div>`;

/* --- Nhập nhanh nhiều câu (bộ đọc văn bản dùng chung) --- */
const RX_HEAD=/^\s*(?:câu|cau|question)\s*\d+\s*[:.)\-–]?\s*/i,RX_OPT=/^\s*(\*)?\s*([A-F])\s*[.)]\s*(.+?)\s*(\*)?\s*$/,RX_ITEM=/^\s*([a-d])\s*[).]\s*(.+?)\s*$/,RX_SUF=/\s*[\(\[]\s*(đúng|sai|đ|s)\s*[\)\]]\s*\.?$/i,RX_ANS=/^\s*(?:đáp án|dap an|đ\/a|answer)(?:\s*đúng)?\s*[:：]\s*(.+)$/i,RX_HINT=/^\s*(?:gợi ý|goi y|hint)\s*\d*\s*[:：]\s*(.*)$/i,RX_EXP=/^\s*(?:giải thích|giai thich|lời giải|loi giai|explanation)\s*[:：]\s*(.*)$/i;
function tfTokens(x){let t=" "+String(x).normalize("NFC").toLowerCase().replace(/([\s,;(]|^)[a-d]\s*[).:\-–]/g," ")+" ",out=[];for(const w of t.split(/[^a-zà-ỹđ0-9]+/)){if(!w)continue;if(/^(đúng|dung|true|đ|1|x)$/.test(w))out.push(true);else if(/^(sai|false|s|0)$/.test(w))out.push(false);else if(/^[đs]+$/.test(w))for(const ch of w)out.push(ch==="đ")}return out}
function cut(s){return s.length>50?s.slice(0,50)+"…":s}
function parseBulk(text){let lines=String(text||"").normalize("NFC").replace(/\r/g,"").split("\n"),blocks=[],cur=[],hasHead=lines.some(l=>RX_HEAD.test(l));
 let started=false;for(const l of lines){if(hasHead){if(RX_HEAD.test(l)){if(cur.length)blocks.push(cur);cur=[l.replace(RX_HEAD,"")];started=true}else if(started)cur.push(l)}else{if(!l.trim()){if(cur.length)blocks.push(cur);cur=[]}else cur.push(l)}}
 if(cur.length)blocks.push(cur);
 let qs=[],errors=[];
 blocks.forEach((bl,bi)=>{let qL=[],opts=[],items=[],star=-1,ans=null,hints=[],expl=[],mode="q";
  for(const raw of bl){let l=raw.trim(),m;if(!l||/^\*?\s*[A-Fa-d]\s*[.)]\s*\*?$/.test(l))continue;
   if(m=l.match(RX_ANS)){ans=m[1].trim();mode="meta"}
   else if(m=l.match(RX_HINT)){hints.push(m[1].trim());mode="hint"}
   else if(m=l.match(RX_EXP)){expl.push(m[1].trim());mode="exp"}
   else if((mode==="q"||mode==="item")&&!opts.length&&(m=l.match(RX_ITEM))){let t=m[2],a=null,sf=t.match(RX_SUF);if(sf){a=/^(đúng|đ)$/i.test(sf[1]);t=t.slice(0,sf.index).trim()}items.push({text:t,answer:a});mode="item"}
   else if((mode==="q"||mode==="opt")&&!items.length&&(m=l.match(RX_OPT))&&(mode==="opt"||qL.length)){if(m[1]||m[4])star=opts.length;opts.push(m[3].trim());mode="opt"}
   else if(mode==="q")qL.push(l);else if(mode==="exp")expl.push(l);else if(mode==="hint")hints[hints.length-1]+=" "+l;else if(mode==="opt")opts[opts.length-1]+=" "+l;else if(mode==="item")items[items.length-1].text+=" "+l}
  let question=qL.join(" ").trim(),label=question?`“${cut(question)}”`:`Khối ${bi+1}`,q={type:"",question,hints:[hints[0]||"",hints[1]||""],explanation:expl.join(" ").trim()};
  if(items.length){if(items.length>4){errors.push(`${label}: câu đúng/sai có nhiều hơn 4 ý.`);return}
   if(ans){let tk=tfTokens(ans);if(tk.length===items.length)items.forEach((it,i)=>it.answer=tk[i])}
   let miss=items.map((it,i)=>it.answer==null?AB[i]:"").filter(Boolean);
   if(miss.length){errors.push(`${label}: chưa ghi Đúng/Sai cho ý ${miss.join(", ")} (thêm (Đ) hoặc (S) ở cuối mỗi ý, hoặc dòng “Đáp án: Đ S Đ S”).`);return}
   q.type="tf";q.items=items;if(!q.question)q.question=TF_STEM}
  else if(!question){if(opts.length||ans)errors.push(`${label}: không tìm thấy nội dung câu hỏi.`);return}
  else if(opts.length>=2){q.type="mc";q.options=opts.slice(0,6);let a=star;
   if(a<0&&ans){let x=ans.replace(/[.)\s]/g,"");a=/^[A-F]$/i.test(x)?L.indexOf(x.toUpperCase()):opts.findIndex(o=>norm(o)===norm(ans))}
   if(a<0||a>=q.options.length){errors.push(`${label}: chưa đánh dấu đáp án đúng (gạch chân, tô đỏ, thêm dấu * trước phương án đúng, hoặc thêm dòng “Đáp án: B”).`);return}q.answer=a}
  else if(opts.length===1){errors.push(`${label}: chỉ có 1 phương án, cần ít nhất 2.`);return}
  else if(ans&&/^(đúng|dung|đ|sai|s)$/i.test(ans.trim())){q.type="tf";q.items=[{text:question,answer:tfTokens(ans)[0]}];q.question="Xét tính đúng sai của phát biểu sau:"}
  else{errors.push(ans?`${label}: dạng trả lời ngắn không còn được dùng – hãy soạn thành trắc nghiệm (A, B, C, D) hoặc đúng/sai (a, b, c, d).`:`${label}: chưa có phương án A, B, C, D hoặc các ý a), b), c), d).`);return}
  qs.push(q)});
 return{qs,errors}}
/* ===== KIỂM TRA CÂU HỎI TRƯỚC KHI XUẤT BẢN ===== */
let ckScope="all",ckSel={},ckSus={};
function runCheck(scope){let list=questions.map((q,i)=>({q,i})).filter(x=>scope==null||scope==="all"||x.q.lesson===scope),res=[],sum={ok:0,fix:0,warn:0,err:0,noexp:0},seen={};
 for(const{q,i}of list){let r={i,q,fixes:[],sus:[],warns:[],errs:[]};
  if(!usable(q)){r.errs.push("Dạng trả lời ngắn cũ – học sinh không thấy câu này. Hãy xóa hoặc soạn lại thành trắc nghiệm.")}
  else{for(const[k,label]of qFields(q)){let v=getF(q,k);if(!v)continue;let c=convVec(v);if(c.n)r.fixes.push({k,label,before:v,after:c.s});else{let s=susVec(v);if(s)r.sus.push({k,label,before:v,after:s.s,toks:s.toks})}
    if(/\$|\\(?!vec\b|overrightarrow\b)[a-zA-Z]+/.test(c.s))r.warns.push(`${label}: có kí hiệu LaTeX chưa hiển thị được (${esc((c.s.match(/\\(?!vec\b)[a-zA-Z]+|\$/)||[""])[0])}). Hãy gõ bằng kí tự thường như √, ², °.`)}
   if(q.type==="mc"){if(!String(q.question||"").trim())r.errs.push("Chưa có nội dung câu hỏi.");if((q.options||[]).length<2)r.errs.push("Cần ít nhất 2 phương án.");if(!(q.answer>=0&&q.answer<(q.options||[]).length))r.errs.push("Đáp án đúng không hợp lệ.");let ns=(q.options||[]).map(norm);if(new Set(ns).size<ns.length)r.errs.push("Có phương án bị trùng nhau.")}
   if(q.type==="tf"){if((q.items||[]).some(it=>!String(it.text||"").trim()))r.errs.push("Có ý chưa có nội dung.");if((q.items||[]).length<4)r.warns.push(`Câu đúng/sai mới có ${(q.items||[]).length} ý (đề chuẩn có 4 ý a, b, c, d).`)}
   let key=q.lesson+"|"+qSig(q);if(seen[key]!=null)r.warns.push(`Trùng với câu khác trong ${lessonLabel(q.lesson)}.`);seen[key]=i;
   if(!String(q.explanation||"").trim())sum.noexp++}
  if(r.errs.length)sum.err++;else if(r.warns.length)sum.warn++;if(r.fixes.length)sum.fix++;if(!r.errs.length&&!r.warns.length&&!r.fixes.length&&!r.sus.length)sum.ok++;if(r.sus.length&&!r.errs.length&&!r.warns.length)sum.warn++;
  if(r.errs.length||r.warns.length||r.fixes.length||r.sus.length)res.push(r)}
 return{res,sum,total:list.length}}
function stCheck(){let scope=ckScope==="all"?"all":stLesson,{res,sum,total}=runCheck(scope);
 res.forEach(r=>{if(ckSel[r.i]==null)ckSel[r.i]=true});
 let nSel=res.filter(r=>r.fixes.length&&ckSel[r.i]).length+res.filter(r=>r.sus.length&&ckSus[r.i]).length;
 document.getElementById("studioBody").innerHTML=`<div class="contentbox"><div class="studio-head" style="margin:0"><h3>🔍 Kiểm tra câu hỏi trước khi gửi học sinh</h3><div class="seg" style="min-width:300px">${[["all","Tất cả các bài"],["one",lessonLabel(stLesson)]].map(([k,t])=>`<button class="${ckScope===k?"active":""}" onclick="ckScope='${k}';stCheck()">${t}</button>`).join("")}</div></div>
 <p class="muted">Hệ thống kiểm tra kí hiệu vectơ, đáp án, phương án trùng, câu trùng… Các lỗi kí hiệu có thể sửa tự động bằng một nút bấm.</p>
 <div class="ckrow"><span class="ckpill ok">✅ ${sum.ok}/${total} câu ổn</span><span class="ckpill fix">🔧 ${sum.fix} câu cần sửa kí hiệu vectơ</span><span class="ckpill warn">⚠ ${sum.warn} câu cần xem lại</span><span class="ckpill err">❌ ${sum.err} câu có lỗi</span>${sum.noexp?`<span class="ckpill" style="background:#f1f5f9;color:#475569">ℹ ${sum.noexp} câu chưa có giải thích</span>`:""}</div>
 ${res.length?`<div class="savebar" style="position:sticky;top:0;bottom:auto;border:0;border-bottom:1px solid var(--border);padding:10px 0"><div class="actions"><button class="green" onclick="applyFixes()" ${nSel?"":"disabled"}>🔧 Áp dụng sửa cho ${nSel} câu đã chọn</button>${sum.fix?`<button class="secondary small" onclick="ckAll(true)">Chọn tất cả</button><button class="secondary small" onclick="ckAll(false)">Bỏ chọn</button>`:""}<span class="muted" style="font-size:13px">Dòng gạch ngang là chữ hiện tại, dòng dưới là cách học sinh sẽ thấy sau khi sửa.</span></div></div>
 ${res.map(r=>{let q=r.q,cls=r.errs.length?"err":r.warns.length||r.sus.length?"warn":"fix";return `<div class="ckq ${cls}"><div class="qtop"><span><span class="pill lessonpill">${lessonLabel(q.lesson)}</span> <span class="pill">${typeName[q.type]||q.type}</span></span><div class="actions">${usable(q)?`<button class="iconbtn" onclick="ckEdit(${r.i})">✏ Sửa câu này</button>`:""}<button class="iconbtn del" onclick="ckDel(${r.i})">🗑 Xóa</button></div></div>
  <div class="qtext">${mx(q.question)}</div>
  ${r.errs.map(e=>`<div class="ckline" style="color:#b91c1c">❌ ${esc(e)}</div>`).join("")}${r.warns.map(w=>`<div class="ckline" style="color:#b45309">⚠ ${w}</div>`).join("")}
  ${r.fixes.length?`<label class="check" style="margin-top:8px"><input type="checkbox" ${ckSel[r.i]?"checked":""} onchange="ckSel[${r.i}]=this.checked;stCheck()"> <b>Sửa kí hiệu vectơ (${r.fixes.length} chỗ)</b></label>${r.fixes.map(f=>`<div class="ckfix"><span class="f">${f.label}</span><span>Trước:</span><span class="b">${esc(f.before)}</span><span>Sau:</span><span class="a">${mx(f.after)}</span></div>`).join("")}`:""}
  ${r.sus.length?`<label class="check" style="margin-top:8px"><input type="checkbox" ${ckSus[r.i]?"checked":""} onchange="ckSus[${r.i}]=this.checked;stCheck()"> <b>Có thể thiếu kí hiệu vectơ ở: ${[...new Set(r.sus.flatMap(s=>s.toks))].join(", ")}</b> <span class="muted">(chỉ chọn nếu đây là vectơ, không phải độ dài)</span></label>${r.sus.map(f=>`<div class="ckfix"><span class="f">${f.label}</span><span>Hiện tại:</span><span>${mx(f.before)}</span><span>Nếu sửa:</span><span class="a">${mx(f.after)}</span></div>`).join("")}`:""}</div>`}).join("")}`:`<div class="feedback good" style="font-size:16px">🎉 Tất cả ${total} câu hỏi đều ổn. Cô có thể sang tab <b>💾 Sao lưu & gửi học sinh</b> để xuất bản.</div>`}</div>`}
function ckAll(v){runCheck(ckScope==="all"?"all":stLesson).res.forEach(r=>{if(r.fixes.length)ckSel[r.i]=v});stCheck()}
function applyFixes(){let{res}=runCheck(ckScope==="all"?"all":stLesson),n=0;
 for(const r of res){let q=questions[r.i],ch=false;if(r.fixes.length&&ckSel[r.i]){for(const f of r.fixes)setF(q,f.k,f.after);ch=true}if(r.sus.length&&ckSus[r.i]){for(const f of r.sus){let cur=getF(q,f.k);setF(q,f.k,cur===f.before?f.after:String(cur).replace(SUS_TOK,k=>`\\vec{${k}}`))}ch=true;ckSus[r.i]=false}if(ch)n++}
 if(!n)return toast("Chưa chọn câu nào để sửa","err");saveQ();toast(`✅ Đã sửa ${n} câu hỏi`);studio()}
function ckEdit(i){stLesson=questions[i].lesson;editIdx=null;draft=null;studio().then(()=>editQ(i))}
function ckDel(i){if(!confirm("Xóa câu hỏi này?\n\n“"+questions[i].question+"”"))return;questions.splice(i,1);ckSel={};ckSus={};saveQ();toast("Đã xóa câu hỏi");studio()}

const DEV=(()=>{let d=localStorage.getItem("vec_dev");if(!d){d="d"+Math.random().toString(36).slice(2,10);localStorage.setItem("vec_dev",d)}return d})();
const syncUrl=()=>/^https:\/\/script\.google(usercontent)?\.com\/\S+$/.test(CFG.syncUrl||"")?CFG.syncUrl:"";
const isAdminUser=()=>!!student&&student.class==="Quản trị";
const qsJoin=(u,q)=>u+(u.includes("?")?"&":"?")+q;
let SID=null,actSec=0,lastInput=Date.now(),lastTimeSent=0,flushTimer=null,flushing=false;
function readJ(k,d){try{return JSON.parse(localStorage.getItem(k)||"null")??d}catch(e){return d}}
function logEv(ev){ev.ts=Date.now();ev.dev=DEV;ev.sid=SID||"";if(student&&!isAdminUser()){ev.name=student.name;ev.cls=student.class}else if(ev.t!=="visit")return;
 try{let a=readJ("vec_events",[]);a.push(ev);if(a.length>4000)a=a.slice(-4000);localStorage.setItem("vec_events",JSON.stringify(a))}catch(e){}
 if(!syncUrl())return;try{let q=readJ("vec_queue",[]);q.push(ev);localStorage.setItem("vec_queue",JSON.stringify(q.slice(-1500)))}catch(e){}
 clearTimeout(flushTimer);flushTimer=setTimeout(flush,ev.t==="prac"||ev.t==="time"?15000:800)}
async function flush(beacon){let url=syncUrl();if(!url||flushing)return;let q=readJ("vec_queue",[]);if(!q.length)return;let part=q.slice(0,200),body=JSON.stringify({events:part});
 const drop=()=>{try{localStorage.setItem("vec_queue",JSON.stringify(readJ("vec_queue",[]).slice(part.length)))}catch(e){}};
 if(beacon===true){try{if(navigator.sendBeacon&&navigator.sendBeacon(url,new Blob([body],{type:"text/plain;charset=utf-8"})))drop()}catch(e){}return}
 flushing=true;try{let r=await fetch(url,{method:"POST",body,headers:{"Content-Type":"text/plain;charset=utf-8"}}),j=await r.json();if(j&&j.ok){drop();if(q.length>part.length)setTimeout(flush,400)}}catch(e){}finally{flushing=false}}
function startSession(){if(isAdminUser())return;SID="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);actSec=0;lastTimeSent=0;lastInput=Date.now();logEv({t:"login"})}
function sendTime(){if(!SID||actSec===lastTimeSent)return;lastTimeSent=actSec;logEv({t:"time",sec:actSec})}

["mousemove","keydown","touchstart","scroll","click"].forEach(ev=>addEventListener(ev,()=>{lastInput=Date.now()},{passive:true}));
setInterval(()=>{if(!SID||document.visibilityState!=="visible"||Date.now()-lastInput>120000)return;actSec+=15;if(actSec-lastTimeSent>=180)sendTime()},15000);
addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){sendTime();clearTimeout(flushTimer);flush(true)}else loadStats()});
addEventListener("pagehide",()=>{sendTime();clearTimeout(flushTimer);flush(true)});

function statsHTML(){if(!syncUrl()||!STATS)return"";return `👁 ${fmtN(STATS.visits)} lượt truy cập · hôm nay ${fmtN(STATS.today)} · 🧑‍🎓 ${fmtN(STATS.students)} học sinh`}

 ${attn.length?`<div class="feedback help" style="margin-bottom:14px"><b>⚠ Cần chú ý (${attn.length} em):</b> ${attn.slice(0,12).map(s=>`<a href="#" onclick="AN.sel='${esc(s.key).replace(/'/g,"\\'")}';stStats();return false">${esc(s.name)}</a> <span class="muted">(${s.tag.c==="idle"?"lâu chưa vào học":s.tag.c==="down"?"điểm giảm":"điểm TB "+fmtPts(Math.round(s.avg*100)/100)})</span>`).join(", ")}${attn.length>12?"…":""}</div>`:""}
 <h4 style="margin:6px 0 8px">Bảng theo dõi từng học sinh <span class="muted" style="font-weight:500">· bấm vào tên để xem chi tiết, bấm tiêu đề cột để sắp xếp</span></h4>
 ${list.length?`<div class="tablewrap"><table class="antable"><thead><tr>${th("name","Học sinh")}${th("cls","Lớp")}${th("visits","Số lần học",1)}${th("time","Tổng thời gian",1)}${th("last","Lần gần nhất",1)}${th("acc","Luyện tập (đúng)",1)}${th("tests","Bài KT",1)}${th("avg","Điểm TB",1)}<th>Điểm các lần KT</th>${th("delta","Tiến bộ",1)}</tr></thead><tbody>${list.map(s=>`<tr class="click" onclick="AN.sel='${esc(s.key).replace(/'/g,"\\'")}';stStats();window.scrollTo({top:0,behavior:'smooth'})"><td><b>${esc(s.name)}</b></td><td>${esc(s.cls)}</td><td class="num">${s.visits}</td><td class="num">${fmtDur(s.time)}</td><td class="num" title="${fmtDT(s.last)}">${relDay(s.last)}</td><td class="num">${s.prac?`${Math.round(s.acc*100)}% <span class="muted">(${s.prac})</span>`:"—"}</td><td class="num">${s.tests.length}</td><td class="num"><b>${s.avg!=null?fmtPts(Math.round(s.avg*100)/100):"—"}</b></td><td>${sparkSVG(s.tests.map(x=>x.score))}</td><td><span class="tag ${s.tag.c}">${s.tag.t}${s.trend.delta!=null&&s.tests.length>1?` ${s.trend.delta>=0?"+":"−"}${fmtPts(Math.abs(s.trend.delta))}`:""}</span></td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">Chưa có dữ liệu học tập trong khoảng thời gian này.</p>`}`}
function detailHTML(s){let sc=s.tests;
 return `<div class="actions" style="margin-bottom:10px"><button class="secondary small" onclick="AN.sel=null;stStats()">← Quay lại danh sách</button><h3 style="margin:0">🧑‍🎓 ${esc(s.name)} <span class="muted" style="font-weight:500">· Lớp ${esc(s.cls)}</span></h3><span class="tag ${s.tag.c}">${s.tag.t}</span></div>
 <div class="kpis">${[["Số lần vào học",s.visits,`từ ${new Date(s.first).toLocaleDateString("vi-VN")}`],["Tổng thời gian",fmtDur(s.time),s.visits?`TB ${fmtDur(s.time/s.visits)}/lần`:""],["Luyện tập",s.prac?Math.round(s.acc*100)+"%":"—",s.prac?`đúng ${s.pracOk}/${s.prac} lượt`:"chưa luyện tập"],["Bài kiểm tra",sc.length,sc.length?`cao nhất ${fmtPts(s.best)}`:""],["Điểm TB",s.avg!=null?fmtPts(Math.round(s.avg*100)/100):"—",s.trend.delta!=null?`${s.trend.delta>=0?"▲ +":"▼ −"}${fmtPts(Math.abs(s.trend.delta))} so với ban đầu`:""]].map(([l,v,x])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${x}</div></div>`).join("")}</div>

 <div class="grid2" style="margin-top:16px"><div><h4 style="margin:0 0 8px">Các lần kiểm tra</h4>${sc.length?`<div class="tablewrap" style="max-height:340px"><table class="antable"><thead><tr><th>Thời điểm</th><th>Bài</th><th class="num">Điểm</th><th class="num">Trắc nghiệm</th><th class="num">Đúng/Sai</th><th class="num">Thời gian làm</th></tr></thead><tbody>${sc.slice().reverse().map(e=>`<tr><td>${fmtDT(e.ts)}</td><td>${lessonLabel(e.lesson)}</td><td class="num"><b>${fmtPts(e.score)}</b></td><td class="num">${e.x&&e.x.mcN?`${e.x.mcC}/${e.x.mcN}`:"—"}</td><td class="num">${e.x&&e.x.tfN?`${e.x.tfC}/${e.x.tfN} ý`:"—"}</td><td class="num">${fmtDur(e.sec)}${e.x&&e.x.mins?` / ${e.x.mins} ph`:""}</td></tr>`).join("")}</tbody></table></div>`:'<p class="muted">Chưa có.</p>'}</div>
 <div><h4 style="margin:0 0 8px">Các lần vào học</h4><div class="tablewrap" style="max-height:340px"><table class="antable"><thead><tr><th>Bắt đầu</th><th class="num">Thời lượng</th><th class="num">Luyện tập</th><th class="num">Kiểm tra</th></tr></thead><tbody>${s.sessions.slice().reverse().map(x=>`<tr><td>${fmtDT(x.start)}</td><td class="num">${fmtDur(x.dur)}</td><td class="num">${x.prac}</td><td class="num">${x.tests}</td></tr>`).join("")}</tbody></table></div></div></div>`}
function setupHTML(){let u=CFG.syncUrl||"",code=appsScript(secretKey());
 return `<div class="contentbox" style="border:2px solid #93c5fd"><h3>⚙ Kết nối Google Sheets (làm một lần, khoảng 10 phút)</h3><p class="muted" style="margin-top:-6px">Dữ liệu được lưu trong bảng tính Google của chính cô. Cần đăng nhập tài khoản Google trên trình duyệt.</p>
 <ol style="line-height:1.9;padding-left:20px">
 <li>Mở <a href="https://sheets.new" target="_blank" rel="noopener"><b>một Google Sheets mới</b></a> và đặt tên, ví dụ “Thống kê tự học Vectơ”.</li>
 <li>Trên thanh menu chọn <b>Tiện ích mở rộng → Apps Script</b> (Extensions → Apps Script).</li>
 <li>Xóa hết mã có sẵn trong khung soạn thảo, rồi bấm nút dưới đây và dán vào: <button class="small" onclick="copyText(appsScript(secretKey()),'✅ Đã sao chép mã Apps Script')">📋 Sao chép mã Apps Script</button><div class="codebox" style="margin-top:8px">${esc(code)}</div></li>
 <li>Bấm biểu tượng 💾 <b>Lưu</b>. Sau đó bấm <b>Triển khai → Tác vụ triển khai mới</b> (Deploy → New deployment).</li>
 <li>Bấm ⚙ cạnh “Chọn loại”, chọn <b>Ứng dụng web</b> (Web app). Đặt <b>Thực thi với tư cách: Tôi</b> (Me) và <b>Người có quyền truy cập: Bất kỳ ai</b> (Anyone). Bấm <b>Triển khai</b>.</li>
 <li>Google hỏi cấp quyền: chọn tài khoản của cô → nếu hiện “Google chưa xác minh ứng dụng này”, bấm <b>Nâng cao → Chuyển tới … (không an toàn)</b> → <b>Cho phép</b>. Đây là mã của chính cô nên an toàn.</li>
 <li>Sao chép <b>URL ứng dụng web</b> (dạng https://script.google.com/macros/s/…/exec), dán vào ô dưới, bấm <b>Lưu kết nối</b>.</li></ol>
 <label>URL ứng dụng web</label><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="syncIn" style="flex:1;min-width:260px" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(u)}"><button class="secondary" onclick="testSync()">🔌 Kiểm tra</button><button class="green" onclick="saveSync()">💾 Lưu kết nối</button>${u?`<button class="danger small" onclick="document.getElementById('syncIn').value='';saveSync()">Ngắt kết nối</button>`:""}</div>
 <div class="muted" style="margin-top:10px;line-height:1.6">🔒 Đoạn mã đã có sẵn <b>mã bí mật</b> riêng của máy này để chỉ cô đọc được kết quả; mã bí mật không nằm trong bản gửi học sinh. Nếu đổi sang máy khác, hãy dùng “Tải tệp sao lưu” rồi sao chép lại mã Apps Script trên máy mới.<br>Sau khi kết nối, nhớ <b>tải lại bản gửi học sinh</b> (tab Sao lưu & gửi học sinh) để bản đó cũng gửi dữ liệu về bảng tính. Nên thông báo cho học sinh biết kết quả học tập được ghi nhận để giáo viên theo dõi.</div></div>`}
function anExport(){let from=AN.range?Date.now()-AN.range*DAY:0,rows=(AN.rows||[]).filter(e=>e.ts>=from),list=anStudents(rows).filter(s=>AN.cls==="all"||s.cls===AN.cls);if(!list.length)return toast("Chưa có dữ liệu để xuất","err");
 let m=x=>Math.round(x*10)/10,sum={name:"Tổng hợp",head:["Học sinh","Lớp","Số lần vào học","Tổng thời gian (phút)","Lần gần nhất","Lượt luyện tập","Tỉ lệ đúng (%)","Số bài kiểm tra","Điểm TB","Điểm lần đầu","Điểm gần nhất","Thay đổi (nửa sau − nửa đầu)","Đánh giá"],rows:list.map(s=>[s.name,s.cls,s.visits,m(s.time/60),fmtDT(s.last),s.prac,s.prac?Math.round(s.acc*100):"",s.tests.length,s.avg!=null?Math.round(s.avg*100)/100:"",s.firstScore??"",s.lastScore??"",s.trend.delta??"",s.tag.t.replace(/^[^\p{L}]+/u,"")]),widths:[26,8,12,14,18,12,12,12,10,12,12,16,22],valid:""};
 let tst={name:"Bài kiểm tra",head:["Thời điểm","Học sinh","Lớp","Bài","Điểm","TN đúng","TN tổng","ĐS ý đúng","ĐS tổng ý","Thời gian làm (phút)","Thời gian cho phép (phút)"],rows:list.flatMap(s=>s.tests.map(e=>[fmtDT(e.ts),s.name,s.cls,lessonLabel(e.lesson),e.score,e.x?.mcC??"",e.x?.mcN??"",e.x?.tfC??"",e.x?.tfN??"",m((e.sec||0)/60),e.x?.mins??""])),widths:[18,26,8,10,8,9,9,10,10,14,14],valid:""};
 let ses={name:"Phiên học",head:["Bắt đầu","Học sinh","Lớp","Thời lượng (phút)","Lượt luyện tập","Bài kiểm tra"],rows:list.flatMap(s=>s.sessions.map(x=>[fmtDT(x.start),s.name,s.cls,m(x.dur/60),x.prac,x.tests])),widths:[18,26,8,14,14,12],valid:""};
 download(buildWorkbook([sum,tst,ses],{noGuide:true}),"Bao-cao-hoc-tap-"+new Date().toISOString().slice(0,10)+".xlsx");toast("✅ Đã tải báo cáo Excel")}

function totalSize(){return materials.reduce((a,m)=>a+(m.data?m.data.length*0.75:0),0)}
function stShare(){let sz=totalSize(),ck=runCheck("all").sum,bad=ck.fix+ck.err+ck.warn;
 document.getElementById("studioBody").innerHTML=`<div class="grid2">
 <div class="contentbox" style="border:2px solid ${bad?"#fcd34d":"#86efac"}"><h3>🔍 Bước 1 · Kiểm tra câu hỏi</h3>${bad?`<p>Còn <b>${ck.fix}</b> câu cần sửa kí hiệu vectơ, <b>${ck.warn}</b> câu cần xem lại và <b>${ck.err}</b> câu có lỗi.</p><button onclick="stTab='check';studio()">🔍 Kiểm tra và sửa ngay</button>`:`<p class="okline">✅ Đã kiểm tra: tất cả ${questions.length} câu hỏi đều ổn.</p><button class="secondary" onclick="stTab='check';studio()">Xem chi tiết</button>`}</div>
 <div class="contentbox" style="border:2px solid #86efac"><h3>📤 Bước 2 · Tạo trang web gửi học sinh</h3><div class="muted" style="margin:-4px 0 10px">${syncUrl()?"📊 Đã kết nối Google Sheets – bản gửi học sinh sẽ tự gửi lượt truy cập và kết quả học tập về bảng tính của cô.":`⚠ Chưa kết nối thống kê – bản gửi học sinh sẽ không đếm lượt truy cập. <a href="#" onclick="stTab='stats';AN.setup=true;studio();return false">Kết nối Google Sheets</a>`}</div><p>Tải về <b>một tệp .html duy nhất</b> chứa sẵn toàn bộ tài liệu và câu hỏi của 6 bài. Gửi tệp này cho học sinh qua Zalo, Google Drive, Classroom…; học sinh mở bằng Chrome/Edge là học được ngay, không cần mạng (trừ video YouTube/Drive).</p>
 <label class="check"><input type="checkbox" id="hideTeacher" checked> Ẩn nút “Chế độ giáo viên” trong bản của học sinh <span class="muted">(dù hiện nút, vẫn phải có mật khẩu mới vào được)</span></label>
 <div class="muted" style="margin:6px 0 14px">Dung lượng ước tính: <b>${fmtSize(ORIGINAL_HTML.length+sz*1.34)}</b>${sz>40*MB?` · <span style="color:#b45309">khá nặng, nên chuyển video sang link YouTube/Drive</span>`:""}</div>

 <div class="actions"><button onclick="exportData()">⬇ Tải tệp sao lưu</button><button class="secondary" onclick="document.getElementById('restoreIn').click()">📂 Khôi phục từ tệp</button></div></div>
 <div class="contentbox"><h3>📊 Tổng quan</h3><table class="table"><thead><tr><th>Bài</th><th>Tài liệu</th><th>Câu hỏi</th></tr></thead><tbody>${lessons.map(l=>`<tr><td>${l.icon} ${lessonLabel(l.id)}</td><td>${matsOf(l.id).length}</td><td>${qCount(l.id)}</td></tr>`).join("")}</tbody></table>
 <div style="margin-top:16px"><button class="danger small" onclick="resetAll()">↺ Xóa hết, quay về câu hỏi mẫu ban đầu</button></div></div></div>`}
function bundle(extra){return Object.assign({app:"vecto10",savedAt:Date.now(),questions,materials,cfg:{syncUrl:CFG.syncUrl||""}},extra||{})}
function exportHTML(){let ck=runCheck("all").sum;if(ck.fix+ck.err&&!confirm(`Còn ${ck.fix} câu chưa sửa kí hiệu vectơ và ${ck.err} câu có lỗi.\nNên bấm “Kiểm tra và sửa ngay” trước khi gửi.\n\nVẫn tải về?`))return;let data=bundle({studentOnly:document.getElementById("hideTeacher").checked}),json=JSON.stringify(data).replace(/</g,"\\u003c");
 let html=ORIGINAL_HTML.replace(/(<script id="vec-data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
 download(new Blob([html],{type:"text/html;charset=utf-8"}),"Vecto10-ban-hoc-sinh.html");
 toast(data.studentOnly?"✅ Đã tạo bản cho học sinh. Nếu cần mở lại chế độ giáo viên, thêm #giaovien vào cuối địa chỉ.":"✅ Đã tạo trang web")}
function exportData(){download(new Blob([JSON.stringify(bundle(),null,1)],{type:"application/json"}),"sao-luu-vecto10-"+new Date().toISOString().slice(0,10)+".json");toast("✅ Đã tải tệp sao lưu")}
function importData(file){if(!file)return;let r=new FileReader();r.onload=async()=>{try{let d=JSON.parse(r.result),qs,mats=null;
  if(Array.isArray(d))qs=d;else if(d&&Array.isArray(d.questions)){qs=d.questions;mats=cleanMats(d.materials)}else return toast("Tệp không đúng định dạng","err");
  if(!confirm(`Tệp có ${qs.length} câu hỏi${mats?` và ${mats.length} tài liệu`:""}.\nKhôi phục sẽ THAY THẾ dữ liệu hiện tại. Tiếp tục?`))return;
  questions=qs;saveQ();if(d&&d.cfg&&d.cfg.syncUrl){CFG.syncUrl=d.cfg.syncUrl;saveCfg()}if(mats){materials=mats;Object.keys(urlCache).forEach(k=>delete urlCache[k]);try{await idbReplaceAll(mats)}catch(e){toast("Không lưu được tài liệu – bộ nhớ trình duyệt có thể đã đầy.","err")}}
  toast("✅ Đã khôi phục dữ liệu");studio()}catch(e){toast("Không đọc được tệp","err")}};r.readAsText(file)}
async function resetAll(){if(!confirm("Xóa TẤT CẢ câu hỏi và tài liệu, quay về câu hỏi mẫu ban đầu?\nNên tải tệp sao lưu trước."))return;questions=defaultQuestions.map(q=>({...q}));materials=[];try{await idbClear()}catch(e){}saveQ();editIdx=null;draft=null;toast("Đã quay về dữ liệu mẫu");studio()}

logEv({t:"visit"});setTimeout(()=>flush().then(loadStats),1200);setInterval(loadStats,300000);
if(STUDENT_ONLY){document.getElementById("modeBtn").classList.add("hidden");document.getElementById("adminLink").classList.add("hidden")}
